check-api-surface:
  stage: verify
  extends: .go-cache
  script:
    - make check-api-surface

check-api-diff:
  stage: verify
  extends: .go-cache
  script:
    - make check-api-diff

verify-self-contained:
  stage: verify
  extends: .go-cache
  script:
    - make verify-self-contained

# New `// TENTATIVE` markers must include an issue link.
# This check runs only on merge-request diffs.
tentative-check:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50
    - >
      ADDED=$(git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" -- '*.go' | grep -E '^\+.*// ?TENTATIVE' || true);
      BAD=$(printf '%s\n' "$ADDED" | grep -vE '(#[0-9]+|issues?/[0-9]+)' | grep -v '^\s*$' || true);
      if [ -n "$BAD" ]; then
        echo "New TENTATIVE marker(s) added with no linked issue:";
        echo "$BAD";
        exit 1;
      fi
