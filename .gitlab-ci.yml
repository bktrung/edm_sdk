# Jobs use the same Make targets as local development.

image: golang:1.26.1

variables:
  GOPRIVATE: fgit.zapps.vn
  GOPATH: "$CI_PROJECT_DIR/.go"
  # Keep broker-backed checks opt-in while CI runs on a developer laptop.
  # Set RUN_BROKER_TESTS=1 when starting a pipeline to run them.
  RUN_BROKER_TESTS: "0"

stages:
  - build
  - verify

.go-cache:
  cache:
    key: go-mod-and-tools
    paths:
      - .go/pkg/mod/
      - .tools/

build:
  stage: build
  extends: .go-cache
  script:
    - make build

test-fast:
  stage: verify
  extends: .go-cache
  script:
    - make test-fast
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

test:
  stage: verify
  extends: .go-cache
  script:
    - make test

lint:
  stage: verify
  extends: .go-cache
  script:
    - make lint

verify-agnostic:
  stage: verify
  extends: .go-cache
  script:
    - make verify-agnostic

# Add coverage thresholds as packages gain dedicated coverage requirements.

test-kafka:
  stage: verify
  extends: .go-cache
  rules:
    - if: '$RUN_BROKER_TESTS == "1"'
    - when: never
  services:
    - name: apache/kafka:4.2.1
      alias: kafka
      variables:
        KAFKA_NODE_ID: "1"
        KAFKA_PROCESS_ROLES: "broker,controller"
        KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:19093"
        KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092"
        KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
        KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:19093"
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
        KAFKA_NUM_PARTITIONS: "3"
  variables:
    F1_KAFKA_ENDPOINT: "kafka:19092"
  script:
    - |
      ready_timeout=120
      deadline=$((SECONDS + ready_timeout))
      host=${F1_KAFKA_ENDPOINT%:*}
      port=${F1_KAFKA_ENDPOINT##*:}
      while :; do
        if (/usr/bin/timeout 2 bash -c 'echo >"/dev/tcp/$1/$2"' _ "${host}" "${port}") 2>/dev/null; then
          echo "Kafka fixture ready at ${F1_KAFKA_ENDPOINT}"
          break
        fi
        if (( SECONDS >= deadline )); then
          echo "Kafka fixture never became ready at ${F1_KAFKA_ENDPOINT}" >&2
          exit 1
        fi
        sleep 2
      done
    - make -o kafka-up test-kafka

# The management image is required: the subscription path reads bindings and
# queue arguments over the management API. The endpoint is the job container
# loopback rather than the service alias because the driver refuses a plaintext
# endpoint whose host is not loopback. The wait checks the derived management
# port too, which is the AMQP port plus 10000 and is not overridden here, and it
# is written for sh as well as bash because nothing in this file pins the shell
# the runner uses.
test-rabbitmq:
  stage: verify
  extends: .go-cache
  rules:
    - if: '$RUN_BROKER_TESTS == "1"'
    - when: never
  services:
    - name: rabbitmq:4.3.4-management
      alias: rabbitmq
  variables:
    F1_RABBITMQ_ENDPOINT: "amqp://guest:guest@localhost:5672/"
  script:
    - |
      ready_timeout=120
      deadline=$(( $(date +%s) + ready_timeout ))
      endpoint=${F1_RABBITMQ_ENDPOINT#*//}
      endpoint=${endpoint#*@}
      endpoint=${endpoint%/}
      host=${endpoint%:*}
      port=${endpoint##*:}
      management_port=$((port + 10000))
      while :; do
        if (/usr/bin/timeout 2 bash -c 'echo >"/dev/tcp/$1/$2"' _ "${host}" "${port}") 2>/dev/null &&
          (/usr/bin/timeout 2 bash -c 'echo >"/dev/tcp/$1/$2"' _ "${host}" "${management_port}") 2>/dev/null; then
          echo "RabbitMQ fixture ready at ${host}:${port}"
          break
        fi
        if [ "$(date +%s)" -ge "${deadline}" ]; then
          echo "RabbitMQ fixture never became ready at ${host}:${port}" >&2
          echo "The driver refuses a plaintext endpoint whose host is not loopback, so the broker must be reachable on the job container loopback and the job and service containers must share a network namespace." >&2
          exit 1
        fi
        sleep 2
      done
    - make -o broker-up -o broker-smoke test-rabbitmq-driver

# Same service and the same wait; only the suite differs. When broker tests are
# enabled, this suite runs alongside the driver suite.
