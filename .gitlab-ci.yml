# Every job's script is a single make invocation (doc 15 §12): "if a
# workflow is not a make target, it does not exist." CI, onboarding and a
# developer's shell all run the same entry points.
#
# golangci-lint's version is pinned exactly once, in the Makefile
# (GOLANGCI_LINT_VERSION). lint/verify-agnostic self-install that pin into
# .tools/bin, so CI runs the identical binary a developer runs locally -
# there is nothing here to drift out of sync with the Makefile.

image: golang:1.24.0

variables:
  GOPRIVATE: fgit.zapps.vn
  GOPATH: "$CI_PROJECT_DIR/.go"

stages:
  - build
  - verify

.go-cache:
  cache:
    key: go-mod-and-tools
    paths:
      - .go/pkg/mod/
      - .tools/

build:
  stage: build
  extends: .go-cache
  script:
    - make build

test-fast:
  stage: verify
  extends: .go-cache
  script:
    - make test-fast
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

lint:
  stage: verify
  extends: .go-cache
  script:
    - make lint

verify-agnostic:
  stage: verify
  extends: .go-cache
  script:
    - make verify-agnostic

# Per-package coverage thresholds (doc 11 §2) are added here as each
# package appears; there is nothing to gate on yet (SETUP-06).

# No new `// TENTATIVE` marker without a linked issue reference (doc 11 §7).
# This is a diff check against the merge-request target branch, not a
# repo-wide invariant, so it runs only on MR pipelines and is not a make
# target - a developer never runs it standalone the way they'd run `make
# lint`; it exists solely to look at the diff CI is given.
tentative-check:
  stage: verify
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME" --depth=50
    - >
      ADDED=$(git diff "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" -- '*.go' | grep -E '^\+.*// ?TENTATIVE' || true);
      BAD=$(printf '%s\n' "$ADDED" | grep -vE '(#[0-9]+|issues?/[0-9]+)' | grep -v '^\s*$' || true);
      if [ -n "$BAD" ]; then
        echo "New TENTATIVE marker(s) added with no linked issue:";
        echo "$BAD";
        exit 1;
      fi
