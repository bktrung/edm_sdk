<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f1 SDK - Ordered-by-Key Dispatch Simulator</title>
  <style>
    :root {
      --bg-canvas: #09090b;
      --bg-surface: #111115;
      --bg-surface-glass: rgba(17, 17, 21, 0.75);
      --border-subtle: #222228;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --text-primary: #f4f4f6;
      --text-secondary: #9090a0;
      --text-muted: #555562;

      --color-high: #38bdf8;
      --color-medium: #818cf8;
      --color-low: #94a3b8;
      --color-promo: #f59e0b;
      --color-worker: #10b981;
      --color-break: #f43f5e;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", "Inter", sans-serif;
      --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    header {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #000;
    }

    .brand-title { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
    .brand-sub { color: var(--text-muted); font-size: 12px; margin-left: 6px; font-family: var(--font-mono); }

    .controls-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-hairline);
      border-radius: 9999px;
      padding: 4px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .btn-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 12px;
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
    .btn-pill.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.1); }

    .divider { width: 1px; height: 14px; background: var(--border-hairline); }

    .clock-tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); padding: 0 6px; }

    main {
      flex: 1;
      padding: 24px 36px 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .scenarios-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 4px 8px;
    }

    .tab-row { display: flex; gap: 12px; flex-wrap: wrap; }

    .scenario-tabs {
      display: flex;
      gap: 6px;
      background: rgba(17, 17, 21, 0.6);
      border: 1px solid var(--border-hairline);
      padding: 3px;
      border-radius: 8px;
    }

    .scenario-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scenario-tab:hover { color: var(--text-secondary); }
    .scenario-tab.active { color: var(--text-primary); background: #1e1e24; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

    .scenario-desc { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); max-width: 620px; line-height: 1.5; }

    .stage-container {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    svg.runtime-svg { width: 100%; height: auto; display: block; }
    svg text { user-select: none; }
    svg text:not([fill]) { fill: var(--text-primary); }

    .wire-path { fill: none; stroke: var(--border-subtle); stroke-width: 1.5; }

    .box {
      fill: #141419;
      stroke: var(--border-hairline);
      stroke-width: 1;
    }

    .tray { fill: #0d0d12; stroke: var(--border-hairline); }

    .worker-slot { fill: #141419; stroke: var(--border-hairline); stroke-width: 1; transition: all 0.2s ease; }
    .worker-slot.busy { stroke: var(--color-worker); fill: rgba(16, 185, 129, 0.05); }

    .hud-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    @media (max-width: 900px) {
      .hud-grid { grid-template-columns: repeat(2, 1fr); }
      header, main { padding-left: 16px; padding-right: 16px; }
    }

    .hud-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .hud-label { font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .hud-value { font-size: 18px; font-family: var(--font-mono); font-weight: 600; }
    .hud-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }

    .gauge-bar { width: 100%; height: 3px; background: var(--border-subtle); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .gauge-fill { height: 100%; background: var(--color-high); transition: width 0.2s ease; }

    #tooltip {
      position: absolute;
      background: rgba(17, 17, 21, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 200;
      max-width: 280px;
    }

    #tooltip.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) {
      .controls-pill, .scenario-tabs { flex-wrap: wrap; border-radius: 12px; }
      .brand-sub { display: none; }
      .stage-container { overflow-x: auto; }
      svg.runtime-svg { min-width: 720px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">f1</div>
      <div class="brand-title">event-driven-messaging-sdk</div>
      <div class="brand-sub">/ internal/dispatch / Ordered-by-Key Dispatch Simulator</div>
    </div>

    <div class="controls-pill">
      <button class="btn-pill" id="btn-play-pause"><span id="play-text">Pause</span></button>
      <button class="btn-pill" id="btn-step">Step</button>
      <div class="divider"></div>
      <button class="btn-pill speed-btn" data-speed="0.25">0.25x</button>
      <button class="btn-pill speed-btn" data-speed="0.5">0.5x</button>
      <button class="btn-pill speed-btn active" data-speed="1.0">1.0x</button>
      <button class="btn-pill speed-btn" data-speed="2.0">2.0x</button>
      <button class="btn-pill speed-btn" data-speed="4.0">4.0x</button>
      <div class="divider"></div>
      <span class="clock-tag" id="clock-display">T = 00:00.00</span>
    </div>
  </header>

  <main>
    <div class="scenarios-bar">
      <div class="tab-row">
        <div class="scenario-tabs">
          <button class="scenario-tab active" data-scenario="collision">Key Collision (doc trace)</button>
          <button class="scenario-tab" data-scenario="hotkey">Hot Key</button>
          <button class="scenario-tab" data-scenario="retry">Retry Releases the Key</button>
        </div>
        <div class="scenario-tabs">
          <button class="scenario-tab mode-tab active" data-mode="ordered">OrderedByKey</button>
          <button class="scenario-tab mode-tab" data-mode="unordered">Unordered</button>
        </div>
      </div>
      <div class="scenario-desc" id="scenario-desc"></div>
    </div>

    <div class="stage-container" id="stage-box">
      <svg class="runtime-svg" id="svg-canvas" viewBox="0 0 1200 480">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <g fill="var(--text-secondary)" opacity="0.85" font-family="var(--font-mono)" font-size="10" font-weight="600" letter-spacing="0.08em" text-anchor="middle">
          <text x="145" y="42">01 / SCHEDULER.NEXT()</text>
          <text x="390" y="42">02 / KEY HASH</text>
          <text x="660" y="42">03 / WORKER QUEUES</text>
          <text x="1025" y="42">04 / WORKERS</text>
        </g>

        <!-- Static wires; the per-worker wires are built by the renderer. -->
        <path id="wire-sched" d="M 250 205 L 350 205" class="wire-path" />
        <path id="wire-return" d="M 145 372 L 145 346" class="wire-path" />
        <g id="dynamic-wires"></g>

        <!-- Scheduler: items the pool has not been offered yet, head first. -->
        <g transform="translate(40, 64)">
          <rect width="210" height="282" rx="10" class="box" />
          <text x="16" y="24" font-family="var(--font-mono)" font-size="11" font-weight="600">lane FIFO</text>
          <text id="txt-sched-depth" x="194" y="24" text-anchor="end" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">0 queued</text>
          <text x="16" y="42" font-family="var(--font-mono)" font-size="8.5" fill="var(--text-muted)">head (next pick) first; asked only while Free()</text>
          <g id="items-sched" transform="translate(16, 56)"></g>
          <text id="txt-broker" x="16" y="268" font-family="var(--font-mono)" font-size="8.5" fill="var(--text-muted)">broker backlog: 0 (prefetch 0)</text>
        </g>

        <!-- Broker retry: delayed copies that come back as fresh deliveries. -->
        <g id="retry-box" transform="translate(40, 372)">
          <rect width="210" height="84" rx="10" class="box" />
          <text x="16" y="22" font-family="var(--font-mono)" font-size="11" font-weight="600">broker retry</text>
          <text id="txt-retry-count" x="194" y="22" text-anchor="end" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">0 parked</text>
          <g id="items-retry" transform="translate(16, 36)"></g>
        </g>

        <!-- Hash lens -->
        <g id="hash-lens" transform="translate(390, 205)">
          <circle id="lens-ring" cx="0" cy="0" r="40" fill="#131317" stroke="var(--border-hairline)" stroke-width="1.5" />
          <text id="lens-l1" x="0" y="-10" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600">FNV-1a(key)</text>
          <text id="lens-l2" x="0" y="4" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="600" fill="var(--color-high)">% 2</text>
          <text id="lens-l3" x="0" y="18" text-anchor="middle" font-family="var(--font-mono)" font-size="8" fill="var(--text-muted)">IDLE</text>
        </g>

        <g id="queues-layer"></g>
        <g id="workers-layer"></g>

        <!-- Completion order, oldest left. A break is drawn in red. -->
        <g transform="translate(300, 404)">
          <text x="0" y="0" font-family="var(--font-mono)" font-size="10" font-weight="600" letter-spacing="0.08em" fill="var(--text-secondary)">05 / COMPLETION ORDER</text>
          <rect x="0" y="12" width="850" height="36" rx="6" class="tray" />
          <g id="items-done" transform="translate(12, 30)"></g>
        </g>

        <g id="particles-layer"></g>
      </svg>
    </div>

    <div class="hud-grid">
      <div class="hud-card">
        <span class="hud-label">pool.Free()</span>
        <div class="hud-value" id="hud-free">TRUE</div>
        <div class="hud-sub" id="hud-free-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-free" style="background: var(--color-worker);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Head-of-Line Wait</span>
        <div class="hud-value" id="hud-hol">0</div>
        <div class="hud-sub" id="hud-hol-sub">Items queued behind a busy worker while another worker is idle</div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-hol" style="background: var(--color-promo);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Per-Key Order</span>
        <div class="hud-value" id="hud-order">INTACT</div>
        <div class="hud-sub" id="hud-order-sub">Same-key overlaps: 0</div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-order" style="background: var(--color-break);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Completed / Retried</span>
        <div class="hud-value" id="hud-done">0 / 0</div>
        <div class="hud-sub" id="hud-done-sub">Workers busy: 0 / 0</div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-busy" style="background: var(--color-worker);"></div></div>
      </div>
    </div>
  </main>

  <div id="tooltip"></div>

  <script>
    // =========================================================================
    // 1. DETERMINISTIC VIRTUAL CLOCK
    // =========================================================================
    class VirtualClock {
      constructor() { this.currentMs = 0; }
      now() { return this.currentMs; }
      advance(ms) { this.currentMs += ms; }
      format() {
        const totalSec = Math.floor(this.currentMs / 1000);
        const mins = Math.floor(totalSec / 60).toString().padStart(2, "0");
        const secs = (totalSec % 60).toString().padStart(2, "0");
        const frac = Math.floor((this.currentMs % 1000) / 10).toString().padStart(2, "0");
        return `T = ${mins}:${secs}.${frac}`;
      }
    }

    // =========================================================================
    // 2. F1 DISPATCH POOL (1:1 PORT OF internal/dispatch/pool.go)
    // =========================================================================
    // hash/fnv New32a over the key bytes.
    function fnv1a32(key) {
      let hash = 0x811c9dc5;
      for (const byte of new TextEncoder().encode(key)) {
        hash ^= byte;
        hash = Math.imul(hash, 0x01000193) >>> 0;
      }
      return hash >>> 0;
    }

    function queueIndex(hash, queueCount) {
      return hash % queueCount;
    }

    class Pool {
      // NewPool: ordered gives every worker its own queue; unordered shares one.
      // queueSize is raised to concurrency when smaller.
      constructor(concurrency, ordered, queueSize) {
        if (queueSize < concurrency) queueSize = concurrency;
        this.ordered = ordered;
        this.queueDepth = queueSize;
        this.outstanding = 0;
        this.workers = Array.from({ length: concurrency }, (_, id) => ({ id, busy: false, msg: null, remaining: 0, total: 0 }));
        if (ordered) {
          this.queues = Array.from({ length: concurrency }, () => []);
          this.unfinished = new Array(concurrency).fill(0);
          this.idleWorkers = concurrency;
        } else {
          this.queues = [[]];
        }
      }

      // Ordered: a worker with nothing unfinished. Unordered: room below the
      // queue depth, counting running and queued work alike.
      free() {
        if (this.ordered) return this.idleWorkers > 0;
        return this.outstanding < this.queueDepth;
      }

      // The worker index is chosen once here and reused by release.
      submit(msg) {
        let worker = 0;
        if (this.ordered) {
          worker = queueIndex(fnv1a32(msg.key), this.queues.length);
        }
        this.outstanding++;
        if (this.ordered) {
          if (this.unfinished[worker] === 0) this.idleWorkers--;
          this.unfinished[worker]++;
        }
        msg.worker = worker;
        msg.submitSeq = this.submitted = (this.submitted || 0) + 1;
        this.queues[worker].push(msg);
        return worker;
      }

      release(worker) {
        if (this.ordered) {
          this.unfinished[worker]--;
          if (this.unfinished[worker] === 0) this.idleWorkers++;
        }
        this.outstanding--;
      }

      // Each goroutine in start() receives from its queue. Ordered worker i
      // reads only queue i; unordered workers all read the shared queue.
      // Within one tick, work is started in the order it was submitted.
      pull(onStart) {
        for (;;) {
          let w = null;
          let queue = null;
          for (const candidate of this.workers) {
            if (candidate.busy) continue;
            const q = this.ordered ? this.queues[candidate.id] : this.queues[0];
            if (q.length === 0) continue;
            if (queue === null || q[0].submitSeq < queue[0].submitSeq) { w = candidate; queue = q; }
          }
          if (w === null) return;
          const msg = queue.shift();
          w.busy = true;
          w.msg = msg;
          w.remaining = msg.duration;
          w.total = msg.duration;
          onStart(w, msg);
        }
      }

      busyCount() { return this.workers.filter(w => w.busy).length; }
    }

    // =========================================================================
    // 3. SCENARIOS
    // =========================================================================
    const KEY_COLORS = ["#38bdf8", "#818cf8", "#34d399", "#f472b6", "#a3e635", "#fb923c"];

    const scenarios = {
      collision: {
        desc: "The deep-dive trace: two workers, keys ordered-key-0/1/2. Keys 0 and 2 both hash to queue 1, so C waits behind A on worker 1 while worker 0 serves B.",
        concurrency: 2,
        prefetch: 6,
        keys: [
          { key: "ordered-key-0", label: "A" },
          { key: "ordered-key-1", label: "B" },
          { key: "ordered-key-2", label: "C" },
        ],
        // Delivery order and handler times reproduce the doc's start and finish columns.
        script: [["A", 1500], ["B", 600], ["A", 900], ["C", 900], ["B", 600], ["C", 900]],
      },
      hotkey: {
        desc: "Six keys, one hot: order-A is 60% of traffic. Every order-A message lands on the same worker, so its queue grows while other workers sit idle.",
        concurrency: 4,
        prefetch: 16,
        rate: 3.2,
        hot: 0.6,
        failRate: 0,
        keys: "ABCDEF".split("").map(l => ({ key: `order-${l}`, label: l })),
      },
      retry: {
        desc: "A retryable failure publishes a delayed copy with the same key, then acks the source. The worker is freed at once, so a later same-key message can finish first.",
        concurrency: 4,
        prefetch: 12,
        rate: 3.0,
        hot: 0,
        failRate: 0.18,
        retryDelay: 2500,
        keys: "ABCDEF".split("").map(l => ({ key: `order-${l}`, label: l })),
      },
    };

    // =========================================================================
    // 4. SIMULATION ORCHESTRATOR
    // =========================================================================
    const clock = new VirtualClock();
    let currentScenario = "collision";
    let ordered = true;
    let pool = null;
    let broker = [];       // published, not yet delivered (prefetch credit bounds delivery)
    let sched = [];        // delivered, waiting for scheduler.Next()
    let retryParked = [];  // delayed copies owned by the broker
    let done = [];         // completion log
    let nextSeq = {};
    let lastDoneSeq = {};
    let orderBreaks = 0;
    let lastBreak = "";
    let overlaps = 0;
    let completed = 0;
    let retried = 0;
    let restartAt = null;
    let lastHash = null;
    let particles = [];
    let isPlaying = true;
    let speedFactor = 1.0;

    function keySpec(label) {
      const cfg = scenarios[currentScenario];
      const index = cfg.keys.findIndex(k => k.label === label);
      return { ...cfg.keys[index], color: KEY_COLORS[index % KEY_COLORS.length] };
    }

    function publish(label, duration, failFirst) {
      const spec = keySpec(label);
      nextSeq[label] = (nextSeq[label] || 0) + 1;
      broker.push({
        id: `${label}${nextSeq[label]}`,
        label,
        key: spec.key,
        color: spec.color,
        seq: nextSeq[label],
        duration,
        failFirst,
        attempt: 1,
        worker: -1,
      });
    }

    function setScenario(sc) {
      currentScenario = sc;
      document.querySelectorAll(".scenario-tab[data-scenario]").forEach(t => t.classList.toggle("active", t.dataset.scenario === sc));
      document.querySelectorAll(".mode-tab").forEach(t => t.classList.toggle("active", (t.dataset.mode === "ordered") === ordered));
      document.getElementById("scenario-desc").textContent = scenarios[sc].desc;
      reset();
    }

    function reset() {
      const cfg = scenarios[currentScenario];
      // worker.go: queueDepth is Concurrency, or the prefetch when ordered.
      pool = new Pool(cfg.concurrency, ordered, ordered ? cfg.prefetch : cfg.concurrency);
      broker = [];
      sched = [];
      retryParked = [];
      done = [];
      nextSeq = {};
      lastDoneSeq = {};
      orderBreaks = 0;
      lastBreak = "";
      overlaps = 0;
      completed = 0;
      retried = 0;
      restartAt = null;
      lastHash = null;
      particles = [];
      if (cfg.script) cfg.script.forEach(([label, ms]) => publish(label, ms, false));
      buildLayout();
    }

    function inFlight() {
      return sched.length + pool.outstanding;
    }

    function arrivals(deltaMs) {
      const cfg = scenarios[currentScenario];
      if (cfg.script) {
        if (restartAt === null && broker.length === 0 && inFlight() === 0) restartAt = clock.now() + 2000;
        if (restartAt !== null && clock.now() >= restartAt) {
          restartAt = null;
          done = [];
          nextSeq = {};
          lastDoneSeq = {};
          cfg.script.forEach(([label, ms]) => publish(label, ms, false));
        }
        return;
      }
      if (broker.length > 24) return;
      if (Math.random() < cfg.rate * (deltaMs / 1000)) {
        let label;
        if (cfg.hot > 0 && Math.random() < cfg.hot) {
          label = cfg.keys[0].label;
        } else {
          const choices = cfg.hot > 0 ? cfg.keys.slice(1) : cfg.keys;
          label = choices[Math.floor(Math.random() * choices.length)].label;
        }
        publish(label, 500 + Math.random() * 500, Math.random() < cfg.failRate);
      }
    }

    function deliver() {
      const cfg = scenarios[currentScenario];
      // Delivery credit: the broker hands over at most prefetch unsettled messages.
      while (broker.length > 0 && inFlight() < cfg.prefetch) {
        sched.push(broker.shift());
      }
      // Retry copies return as fresh deliveries at the tail once due.
      for (let i = retryParked.length - 1; i >= 0; i--) {
        if (clock.now() >= retryParked[i].dueAt && inFlight() < cfg.prefetch) {
          const copy = retryParked.splice(i, 1)[0].msg;
          sched.push(copy);
          particles.push({ type: "return", progress: 0, color: copy.color });
        }
      }
    }

    // worker.go: for pool.Free() { item := scheduler.Next(); pool.Submit(item) }
    function dispatchLoop() {
      while (pool.free()) {
        const msg = sched.shift();
        if (!msg) break;
        const worker = pool.submit(msg);
        lastHash = { label: msg.id, key: msg.key, hash: fnv1a32(msg.key), queue: worker, at: clock.now() };
        particles.push({ type: "route", queue: worker, progress: 0, color: msg.color });
      }
    }

    function onStart(w, msg) {
      particles.push({ type: "start", worker: w.id, queue: ordered ? w.id : 0, progress: 0, color: msg.color });
      const sameKey = pool.workers.some(o => o !== w && o.busy && o.msg.key === msg.key);
      if (sameKey) overlaps++;
    }

    function finish(w) {
      const msg = w.msg;
      w.busy = false;
      w.msg = null;
      w.remaining = 0;
      if (msg.failFirst && msg.attempt === 1) {
        // Publish the delayed copy with the same key, confirm it, ack the
        // source. The worker is released like any settled delivery.
        const cfg = scenarios[currentScenario];
        const copy = { ...msg, attempt: 2, worker: -1 };
        retryParked.push({ msg: copy, dueAt: clock.now() + cfg.retryDelay, total: cfg.retryDelay });
        retried++;
        particles.push({ type: "retry", worker: w.id, progress: 0, color: msg.color });
      } else {
        completed++;
        const last = lastDoneSeq[msg.label] || 0;
        const broke = msg.seq < last;
        if (broke) {
          orderBreaks++;
          lastBreak = `${msg.label}${last} finished before ${msg.id}`;
        } else {
          lastDoneSeq[msg.label] = msg.seq;
        }
        done.push({ id: msg.id, color: msg.color, broke, attempt: msg.attempt });
        if (done.length > 30) done.shift();
      }
      pool.release(w.id);
    }

    function simulationStep(deltaMs) {
      clock.advance(deltaMs);
      for (const w of pool.workers) {
        if (!w.busy) continue;
        w.remaining -= deltaMs;
        if (w.remaining <= 0) finish(w);
      }
      arrivals(deltaMs);
      deliver();
      dispatchLoop();
      pool.pull(onStart);

      const stepProgress = 0.03 * (deltaMs / 16.67);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].progress += stepProgress;
        if (particles[i].progress >= 1) particles.splice(i, 1);
      }
    }

    // =========================================================================
    // 5. RENDERER
    // =========================================================================
    const svgNS = "http://www.w3.org/2000/svg";
    const tooltip = document.getElementById("tooltip");
    const stageBox = document.getElementById("stage-box");
    let rows = [];      // y centres of queue/worker rows
    let wires = {};     // path elements for particles

    function rowCentres(count) {
      const top = 90, bottom = 330;
      if (count === 1) return [205];
      const step = (bottom - top) / (count - 1);
      return Array.from({ length: count }, (_, i) => top + i * step);
    }

    function el(tag, attrs, parent, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      if (parent) parent.appendChild(node);
      return node;
    }

    function buildLayout() {
      const cfg = scenarios[currentScenario];
      const n = cfg.concurrency;
      rows = rowCentres(n);
      const queueRows = ordered ? rows : [205];
      const wireLayer = document.getElementById("dynamic-wires");
      const queuesLayer = document.getElementById("queues-layer");
      const workersLayer = document.getElementById("workers-layer");
      wireLayer.innerHTML = "";
      queuesLayer.innerHTML = "";
      workersLayer.innerHTML = "";
      wires = { route: [], start: [], retry: [] };

      queueRows.forEach((y, q) => {
        wires.route.push(el("path", { d: `M 430 205 C 475 205, 475 ${y}, 520 ${y}`, class: "wire-path" }, wireLayer));
        const g = el("g", { transform: `translate(520, ${y - 26})` }, queuesLayer);
        el("rect", { width: 280, height: 52, rx: 8, class: "box", id: `queue-box-${q}` }, g);
        el("text", { x: 14, y: 17, "font-family": "var(--font-mono)", "font-size": 10, "font-weight": 600 }, g, ordered ? `queue ${q}` : "shared queue");
        el("text", { x: 266, y: 17, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)", id: `queue-depth-${q}` }, g, "");
        el("rect", { x: 14, y: 25, width: 252, height: 18, rx: 4, class: "tray" }, g);
        el("g", { id: `queue-items-${q}`, transform: "translate(22, 34)" }, g);
      });

      rows.forEach((y, w) => {
        const fromY = ordered ? y : 205;
        wires.start.push(el("path", { d: `M 800 ${fromY} C 850 ${fromY}, 850 ${y}, 900 ${y}`, class: "wire-path" }, wireLayer));
        wires.retry.push(el("path", { d: `M 1025 ${y + 24} C 1025 470, 280 470, 250 414`, class: "wire-path", opacity: 0 }, wireLayer));
        const g = el("g", { transform: `translate(900, ${y - 24})` }, workersLayer);
        el("rect", { width: 250, height: 48, rx: 8, class: "worker-slot", id: `worker-rect-${w}` }, g);
        el("text", { x: 14, y: 20, "font-family": "var(--font-mono)", "font-size": 10, "font-weight": 600 }, g, `Worker #${w}`);
        el("text", { x: 236, y: 20, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)", id: `worker-state-${w}` }, g, "IDLE");
        el("rect", { x: 14, y: 32, width: 222, height: 3, rx: 1.5, fill: "#222228" }, g);
        el("rect", { x: 14, y: 32, width: 0, height: 3, rx: 1.5, fill: "var(--color-worker)", id: `worker-progress-${w}` }, g);
      });

      wires.sched = document.getElementById("wire-sched");
      wires.ret = document.getElementById("wire-return");
      document.getElementById("retry-box").style.opacity = cfg.failRate ? "1" : "0.35";
    }

    function chip(x, y, msg, extra = "") {
      const stroke = msg.attempt > 1 ? "stroke='var(--color-promo)' stroke-width='1.5'" : "";
      return `<g transform="translate(${x}, ${y})" class="packet-node" data-id="${msg.id}" data-key="${msg.key}" data-seq="${msg.seq}" data-attempt="${msg.attempt}" ${extra}>
        <rect x="-16" y="-8" width="32" height="16" rx="4" fill="${msg.color}" fill-opacity="0.85" ${stroke} pointer-events="all" />
        <text x="0" y="3.5" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="700" fill="#09090b" pointer-events="none">${msg.id}</text>
      </g>`;
    }

    function pointOn(path, t) {
      const len = path.getTotalLength();
      return path.getPointAtLength(Math.min(Math.max(t, 0), 1) * len);
    }

    function holCount() {
      // Queued work behind a busy worker while some other worker is idle.
      if (!ordered) return 0;
      const idle = pool.workers.some(w => !w.busy && pool.queues[w.id].length === 0);
      if (!idle) return 0;
      return pool.queues.reduce((sum, q) => sum + q.length, 0);
    }

    function render() {
      const cfg = scenarios[currentScenario];
      document.getElementById("clock-display").textContent = clock.format();

      // Scheduler tray: 5 columns, head top-left.
      document.getElementById("items-sched").innerHTML = sched.slice(0, 24).map((m, i) => chip(15 + (i % 5) * 36, 10 + Math.floor(i / 5) * 26, m)).join("");
      document.getElementById("txt-sched-depth").textContent = `${sched.length} queued`;
      document.getElementById("txt-broker").textContent = `broker backlog: ${broker.length} (prefetch ${cfg.prefetch})`;

      // Retry box.
      document.getElementById("items-retry").innerHTML = retryParked.slice(0, 5).map((p, i) => {
        const left = Math.max(0, p.dueAt - clock.now());
        return `${chip(15 + i * 36, 10, p.msg)}<rect x="${i * 36}" y="24" width="${30 * (1 - left / p.total)}" height="3" rx="1.5" fill="var(--color-promo)" />`;
      }).join("");
      document.getElementById("txt-retry-count").textContent = `${retryParked.length} parked`;

      // Hash lens.
      const recent = lastHash && clock.now() - lastHash.at < 700;
      document.getElementById("lens-l1").textContent = ordered ? "FNV-1a(key)" : "no hash";
      document.getElementById("lens-l2").textContent = ordered ? `% ${cfg.concurrency}` : "shared";
      document.getElementById("lens-l3").textContent = recent ? (ordered ? `${lastHash.label} -> Q${lastHash.queue}` : `${lastHash.label} -> any`) : "WAITING";
      document.getElementById("lens-l3").setAttribute("fill", recent ? "var(--text-primary)" : "var(--text-muted)");
      document.getElementById("lens-ring").setAttribute("stroke", recent ? "var(--color-high)" : "var(--border-hairline)");

      // Queues.
      pool.queues.forEach((q, i) => {
        const items = document.getElementById(`queue-items-${i}`);
        if (!items) return;
        items.innerHTML = q.slice(0, 7).map((m, j) => chip(15 + j * 34, 0, m)).join("") + (q.length > 7 ? `<text x="${7 * 34 + 4}" y="3" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">+${q.length - 7}</text>` : "");
        const depth = document.getElementById(`queue-depth-${i}`);
        const cap = pool.queueDepth;
        depth.textContent = ordered ? `${q.length} queued | unfinished ${pool.unfinished[i]} | cap ${cap}` : `${q.length} queued | outstanding ${pool.outstanding}/${cap}`;
        const waiting = ordered && q.length > 0 && pool.workers.some(w => !w.busy && pool.queues[w.id].length === 0);
        document.getElementById(`queue-box-${i}`).setAttribute("stroke", waiting ? "var(--color-promo)" : "var(--border-hairline)");
        wires.route[i].style.stroke = recent && lastHash.queue === i ? "var(--color-high)" : "var(--border-subtle)";
      });

      // Workers.
      pool.workers.forEach(w => {
        const rect = document.getElementById(`worker-rect-${w.id}`);
        const state = document.getElementById(`worker-state-${w.id}`);
        const progress = document.getElementById(`worker-progress-${w.id}`);
        rect.classList.toggle("busy", w.busy);
        if (w.busy) {
          state.textContent = `${w.msg.id} (${Math.ceil(w.remaining)}ms)`;
          state.setAttribute("fill", w.msg.color);
          progress.setAttribute("width", 222 * Math.max(0, 1 - w.remaining / w.total));
          wires.start[w.id].style.stroke = "var(--color-worker)";
        } else {
          state.textContent = "IDLE";
          state.setAttribute("fill", "var(--text-muted)");
          progress.setAttribute("width", 0);
          wires.start[w.id].style.stroke = "var(--border-subtle)";
        }
      });

      // Completion order.
      document.getElementById("items-done").innerHTML = done.map((d, i) => {
        const x = 15 + i * 27;
        const mark = d.broke ? `<rect x="${x - 13}" y="-10" width="26" height="20" rx="5" fill="none" stroke="var(--color-break)" stroke-width="2" />` : "";
        return `${mark}<text x="${x}" y="4" text-anchor="middle" font-family="var(--font-mono)" font-size="9" font-weight="700" fill="${d.color}">${d.id}</text>`;
      }).join("");

      // Particles.
      document.getElementById("particles-layer").innerHTML = particles.map(p => {
        let pt;
        if (p.type === "route") {
          pt = p.progress < 0.4 ? pointOn(wires.sched, p.progress / 0.4) : (p.progress < 0.55 ? { x: 350 + ((p.progress - 0.4) / 0.15) * 80, y: 205 } : pointOn(wires.route[p.queue], (p.progress - 0.55) / 0.45));
        } else if (p.type === "start") {
          pt = pointOn(wires.start[p.worker], p.progress);
        } else if (p.type === "retry") {
          pt = pointOn(wires.retry[p.worker], p.progress);
        } else {
          pt = pointOn(wires.ret, p.progress);
        }
        return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="${p.type === "retry" ? "var(--color-promo)" : p.color}" filter="url(#glow)" />`;
      }).join("");

      // HUD.
      const free = pool.free();
      document.getElementById("hud-free").textContent = free ? "TRUE" : "FALSE";
      document.getElementById("hud-free").style.color = free ? "var(--color-worker)" : "var(--color-promo)";
      document.getElementById("hud-free-sub").textContent = ordered
        ? `idleWorkers ${pool.idleWorkers} / ${cfg.concurrency} (a worker with nothing unfinished)`
        : `outstanding ${pool.outstanding} < queueDepth ${pool.queueDepth}`;
      document.getElementById("gauge-free").style.width = ordered ? `${(pool.idleWorkers / cfg.concurrency) * 100}%` : `${(1 - pool.outstanding / pool.queueDepth) * 100}%`;

      const hol = holCount();
      document.getElementById("hud-hol").textContent = ordered ? hol : "n/a";
      document.getElementById("hud-hol").style.color = hol > 0 ? "var(--color-promo)" : "var(--text-primary)";
      document.getElementById("hud-hol-sub").textContent = ordered ? "Items queued behind a busy worker while another worker is idle" : "Unordered: any idle worker takes the next item";
      document.getElementById("gauge-hol").style.width = `${Math.min(100, (hol / cfg.prefetch) * 100)}%`;

      document.getElementById("hud-order").textContent = orderBreaks === 0 ? "INTACT" : `${orderBreaks} BREAK${orderBreaks > 1 ? "S" : ""}`;
      document.getElementById("hud-order").style.color = orderBreaks === 0 ? "var(--color-worker)" : "var(--color-break)";
      document.getElementById("hud-order-sub").textContent = `Same-key overlaps: ${overlaps}${lastBreak ? ` | last: ${lastBreak}` : ""}`;
      document.getElementById("gauge-order").style.width = `${Math.min(100, orderBreaks * 10)}%`;

      document.getElementById("hud-done").textContent = `${completed} / ${retried}`;
      document.getElementById("hud-done-sub").textContent = `Workers busy: ${pool.busyCount()} / ${cfg.concurrency}`;
      document.getElementById("gauge-busy").style.width = `${(pool.busyCount() / cfg.concurrency) * 100}%`;
    }

    // Tooltips.
    stageBox.addEventListener("mouseover", (e) => {
      const node = e.target.closest(".packet-node");
      if (!node) return;
      const hash = fnv1a32(node.dataset.key);
      const n = scenarios[currentScenario].concurrency;
      tooltip.innerHTML = `
        <div style="font-weight:600; margin-bottom:4px;">${node.dataset.id}</div>
        <div style="color: var(--text-secondary);">key: <span style="color:#fff;">${node.dataset.key}</span></div>
        <div style="color: var(--text-secondary);">fnv1a32: <span style="color:#fff;">${hash}</span></div>
        <div style="color: var(--text-secondary);">${hash} % ${n} = <span style="color:#fff;">queue ${queueIndex(hash, n)}</span></div>
        <div style="margin-top:4px; font-size:10px; color:${node.dataset.attempt > 1 ? "var(--color-promo)" : "var(--text-muted)"};">
          ${node.dataset.attempt > 1 ? "Retry copy: same key, back through the scheduler" : `Per-key sequence ${node.dataset.seq}`}
        </div>`;
      tooltip.classList.add("visible");
    });
    stageBox.addEventListener("mousemove", (e) => {
      const rect = stageBox.getBoundingClientRect();
      tooltip.style.left = `${e.clientX - rect.left + 16}px`;
      tooltip.style.top = `${e.clientY - rect.top + 16}px`;
    });
    stageBox.addEventListener("mouseout", (e) => {
      if (e.target.closest(".packet-node")) tooltip.classList.remove("visible");
    });

    // Controls.
    document.getElementById("btn-play-pause").addEventListener("click", () => {
      isPlaying = !isPlaying;
      document.getElementById("play-text").textContent = isPlaying ? "Pause" : "Play";
    });
    document.getElementById("btn-step").addEventListener("click", () => {
      if (!isPlaying) { simulationStep(100); render(); }
    });
    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        speedFactor = parseFloat(btn.dataset.speed);
      });
    });
    document.querySelectorAll(".scenario-tab[data-scenario]").forEach(tab => tab.addEventListener("click", () => setScenario(tab.dataset.scenario)));
    document.querySelectorAll(".mode-tab").forEach(tab => tab.addEventListener("click", () => {
      ordered = tab.dataset.mode === "ordered";
      setScenario(currentScenario);
    }));

    let lastFrameTime = performance.now();
    document.addEventListener("visibilitychange", () => { lastFrameTime = performance.now(); });
    function loop(currentTime) {
      if (document.hidden) {
        lastFrameTime = currentTime;
        requestAnimationFrame(loop);
        return;
      }
      const delta = Math.min(currentTime - lastFrameTime, 100);
      lastFrameTime = currentTime;
      if (isPlaying) simulationStep(delta * speedFactor);
      render();
      requestAnimationFrame(loop);
    }

    setScenario("collision");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
