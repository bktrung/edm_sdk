<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f1 SDK - Capacity Chain Simulator</title>
  <style>
    :root {
      --bg-canvas: #09090b;
      --bg-surface: #111115;
      --bg-surface-glass: rgba(17, 17, 21, 0.75);
      --border-subtle: #222228;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --text-primary: #f4f4f6;
      --text-secondary: #9090a0;
      --text-muted: #555562;

      --color-high: #38bdf8;
      --color-medium: #818cf8;
      --color-low: #94a3b8;
      --color-promo: #f59e0b;
      --color-worker: #10b981;
      --color-break: #f43f5e;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", "Inter", sans-serif;
      --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    header {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #000;
    }

    .brand-title { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
    .brand-sub { color: var(--text-muted); font-size: 12px; margin-left: 6px; font-family: var(--font-mono); }

    .controls-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-hairline);
      border-radius: 9999px;
      padding: 4px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .btn-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 12px;
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
    .btn-pill.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.1); }

    .divider { width: 1px; height: 14px; background: var(--border-hairline); }

    .clock-tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); padding: 0 6px; }

    main {
      flex: 1;
      padding: 24px 36px 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .scenarios-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 4px 8px;
    }

    .tab-row { display: flex; gap: 12px; flex-wrap: wrap; }

    .scenario-tabs {
      display: flex;
      gap: 6px;
      background: rgba(17, 17, 21, 0.6);
      border: 1px solid var(--border-hairline);
      padding: 3px;
      border-radius: 8px;
    }

    .scenario-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scenario-tab:hover { color: var(--text-secondary); }
    .scenario-tab.active { color: var(--text-primary); background: #1e1e24; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

    .scenario-desc { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); max-width: 620px; line-height: 1.5; }

    .stage-container {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    svg.runtime-svg { width: 100%; height: auto; display: block; }
    svg text { user-select: none; }
    svg text:not([fill]) { fill: var(--text-primary); }

    .wire-path { fill: none; stroke: var(--border-subtle); stroke-width: 1.5; }

    .box {
      fill: #141419;
      stroke: var(--border-hairline);
      stroke-width: 1;
    }

    .tray { fill: #0d0d12; stroke: var(--border-hairline); }

    .worker-slot { fill: #141419; stroke: var(--border-hairline); stroke-width: 1; transition: all 0.2s ease; }
    .worker-slot.busy { stroke: var(--color-worker); fill: rgba(16, 185, 129, 0.05); }

    .hud-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    @media (max-width: 900px) {
      .hud-grid { grid-template-columns: repeat(2, 1fr); }
      header, main { padding-left: 16px; padding-right: 16px; }
    }

    .hud-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .hud-label { font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .hud-value { font-size: 18px; font-family: var(--font-mono); font-weight: 600; }
    .hud-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }

    .gauge-bar { width: 100%; height: 3px; background: var(--border-subtle); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .gauge-fill { height: 100%; background: var(--color-high); transition: width 0.2s ease; }

    #tooltip {
      position: absolute;
      background: rgba(17, 17, 21, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 200;
      max-width: 280px;
    }

    #tooltip.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) {
      .controls-pill, .scenario-tabs { flex-wrap: wrap; border-radius: 12px; }
      .brand-sub { display: none; }
      .stage-container { overflow-x: auto; }
      svg.runtime-svg { min-width: 720px; }
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      align-items: center;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .config-row label { display: flex; align-items: center; gap: 6px; }

    .config-row input, .config-row select {
      width: 56px;
      background: #0d0d12;
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 8px;
    }

    .config-row input.wide { width: 130px; }
    #cfg-prefetch { width: 72px; }
    .worker-slot.busy { fill: rgba(16, 185, 129, 0.35); }
    .config-row select { width: auto; }
    .config-row input:focus, .config-row select:focus { outline: 1px solid var(--color-high); }

    .banner {
      margin: 0 8px;
      padding: 10px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: none;
    }

    .banner.warn { display: block; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); color: var(--color-promo); }
    .banner.error { display: block; background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.4); color: var(--color-break); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">f1</div>
      <div class="brand-title">event-driven-messaging-sdk</div>
      <div class="brand-sub">/ runnerLanePlan / Capacity Chain Simulator</div>
    </div>

    <div class="controls-pill">
      <button class="btn-pill" id="btn-play-pause"><span id="play-text">Pause</span></button>
      <button class="btn-pill" id="btn-step">Step</button>
      <div class="divider"></div>
      <button class="btn-pill speed-btn" data-speed="0.25">0.25x</button>
      <button class="btn-pill speed-btn" data-speed="0.5">0.5x</button>
      <button class="btn-pill speed-btn active" data-speed="1.0">1.0x</button>
      <button class="btn-pill speed-btn" data-speed="2.0">2.0x</button>
      <button class="btn-pill speed-btn" data-speed="4.0">4.0x</button>
      <div class="divider"></div>
      <span class="clock-tag" id="clock-display">T = 00:00.00</span>
    </div>
  </header>

  <main>
    <div class="scenarios-bar">
      <div class="scenario-tabs">
        <button class="scenario-tab active" data-scenario="defaults">Defaults (16 workers)</button>
        <button class="scenario-tab" data-scenario="bigprefetch">Prefetch Above Lanes</button>
        <button class="scenario-tab" data-scenario="floor">One Worker (floor)</button>
        <button class="scenario-tab" data-scenario="kafka">Kafka Partitions</button>
        <button class="scenario-tab" data-scenario="tooSmall">Prefetch Below Lane Count</button>
      </div>
      <div class="scenario-desc" id="scenario-desc"></div>
    </div>

    <div class="config-row">
      <label>Concurrency <input id="cfg-concurrency" type="number" min="1" max="64" /></label>
      <label>Prefetch <input id="cfg-prefetch" type="number" min="0" placeholder="unset" /></label>
      <label>Topics <input id="cfg-topics" type="number" min="1" max="2" /></label>
      <label>Priorities <input id="cfg-priorities" class="wide" type="text" /></label>
      <label>Weights H/M/L <input id="cfg-weights" class="wide" type="text" /></label>
      <label>RetryWeightDivisor <input id="cfg-divisor" type="number" min="0" /></label>
      <label>PrefetchFactor <input id="cfg-factor" type="number" min="0" /></label>
      <label>MaxAttempts <input id="cfg-attempts" type="number" min="1" max="6" /></label>
      <label>Driver <select id="cfg-driver"><option value="rabbitmq">rabbitmq (free-scaling)</option><option value="kafka">kafka (partition-bound)</option></select></label>
      <label>Partitions <input id="cfg-partitions" type="number" min="1" /></label>
    </div>

    <div class="banner" id="banner"></div>

    <div class="stage-container" id="stage-box">
      <svg class="runtime-svg" id="svg-canvas" viewBox="0 0 1200 480">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <g fill="var(--text-secondary)" opacity="0.85" font-family="var(--font-mono)" font-size="10" font-weight="600" letter-spacing="0.08em" text-anchor="middle">
          <text x="120" y="42">01 / BROKER</text>
          <text x="300" y="42">02 / PREFETCH</text>
          <text x="640" y="42">03 / LANES (runnerLanePlan)</text>
          <text x="1045" y="42">04 / HANDLER POOL</text>
        </g>

        <g id="wires-layer"></g>

        <g transform="translate(40, 170)">
          <rect width="160" height="120" rx="10" class="box" />
          <text x="14" y="24" font-family="var(--font-mono)" font-size="11" font-weight="600">broker</text>
          <text x="14" y="46" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">every destination</text>
          <text x="14" y="60" font-family="var(--font-mono)" font-size="9" fill="var(--text-muted)">backlogged</text>
          <text id="txt-driver" x="14" y="86" font-family="var(--font-mono)" font-size="9" fill="var(--color-high)">rabbitmq</text>
          <text id="txt-delivered" x="14" y="104" font-family="var(--font-mono)" font-size="9" fill="var(--text-secondary)">delivered 0</text>
        </g>

        <!-- Prefetch gate: in-flight against the effective prefetch. -->
        <g transform="translate(250, 70)">
          <rect width="100" height="330" rx="10" class="box" id="prefetch-box" />
          <rect x="38" y="44" width="24" height="240" rx="4" class="tray" />
          <rect id="prefetch-fill" x="38" y="284" width="24" height="0" rx="4" fill="var(--color-high)" opacity="0.8" />
          <text id="txt-prefetch" x="50" y="26" text-anchor="middle" font-family="var(--font-mono)" font-size="12" font-weight="700">0</text>
          <text id="txt-inflight" x="50" y="306" text-anchor="middle" font-family="var(--font-mono)" font-size="9" fill="var(--text-secondary)">0 in flight</text>
          <text id="txt-prefetch-src" x="50" y="320" text-anchor="middle" font-family="var(--font-mono)" font-size="8" fill="var(--text-muted)"></text>
        </g>

        <g id="lanes-layer"></g>
        <g id="pool-layer"></g>
        <g id="particles-layer"></g>
      </svg>
    </div>

    <div class="hud-grid">
      <div class="hud-card">
        <span class="hud-label">Effective Prefetch</span>
        <div class="hud-value" id="hud-prefetch">0</div>
        <div class="hud-sub" id="hud-prefetch-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-prefetch"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Lanes / Total Weight</span>
        <div class="hud-value" id="hud-lanes">0</div>
        <div class="hud-sub" id="hud-lanes-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" style="width: 100%; background: var(--color-medium);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Handler Parallelism</span>
        <div class="hud-value" id="hud-parallel">0</div>
        <div class="hud-sub" id="hud-parallel-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-parallel" style="background: var(--color-worker);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Tightest Ceiling</span>
        <div class="hud-value" id="hud-bottleneck">-</div>
        <div class="hud-sub" id="hud-bottleneck-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" style="width: 100%; background: var(--color-promo);"></div></div>
      </div>
    </div>
  </main>

  <div id="tooltip"></div>

  <script>
    // =========================================================================
    // 1. DETERMINISTIC VIRTUAL CLOCK
    // =========================================================================
    class VirtualClock {
      constructor() { this.currentMs = 0; }
      now() { return this.currentMs; }
      advance(ms) { this.currentMs += ms; }
      format() {
        const totalSec = Math.floor(this.currentMs / 1000);
        const mins = Math.floor(totalSec / 60).toString().padStart(2, "0");
        const secs = (totalSec % 60).toString().padStart(2, "0");
        const frac = Math.floor((this.currentMs % 1000) / 10).toString().padStart(2, "0");
        return `T = ${mins}:${secs}.${frac}`;
      }
    }

    // =========================================================================
    // 2. F1 CAPACITY PLAN (1:1 PORT OF runnerLanePlan, runnerConsumerPrefetch,
    //    resolvePrefetch AND subscriptionLaneCount)
    // =========================================================================
    const defaultRetryWeightDivisor = 2;
    const defaultPrefetchFactor = 2;
    const retryBudgetMultiplier = 2;
    const minimumLaneCapacity = 3;
    const brokerDefaultPrefetch = 64;
    const BUDGETS = { high: 5000, medium: 30000, low: 120000 };

    function retryTiers(maxAttempts) {
      return maxAttempts - 1;
    }

    function subscriptionLaneCount(topics, priorities, maxAttempts) {
      return topics * priorities * (1 + retryTiers(maxAttempts));
    }

    function runnerLanePlan(sub) {
      let divisor = sub.divisor;
      if (divisor < 1) divisor = defaultRetryWeightDivisor;
      let factor = sub.factor;
      if (factor < 1) factor = defaultPrefetchFactor;
      const meta = new Map();
      const groups = new Set();
      let totalWeight = 0;
      for (const topic of sub.topics) {
        for (const priority of sub.priorities) {
          const weight = Math.max(sub.weights[priority] || 0, 1);
          const budget = BUDGETS[priority];
          for (let tier = 0; tier <= retryTiers(sub.maxAttempts); tier++) {
            const laneID = tier > 0 ? `${topic}.${priority}.retry.${tier}` : `${topic}.${priority}.main`;
            let group = laneID;
            let laneWeight = weight;
            let laneBudget = budget;
            if (tier > 0) {
              group = `${topic}.${priority}.retry`;
              laneWeight = Math.max(Math.trunc(laneWeight / divisor), 1);
              laneBudget *= retryBudgetMultiplier;
            }
            meta.set(laneID, { id: laneID, group, weight: laneWeight, budget: laneBudget, priority, tier });
            if (!groups.has(group)) {
              groups.add(group);
              totalWeight += laneWeight;
            }
          }
        }
      }
      if (totalWeight < 1) totalWeight = 1;
      const ids = [...meta.keys()].sort();
      const plan = ids.map(id => {
        const lane = meta.get(id);
        lane.capacity = Math.max(Math.trunc((sub.concurrency * lane.weight + totalWeight - 1) / totalWeight), minimumLaneCapacity) * factor;
        return lane;
      });
      return { plan, totalWeight, factor, divisor };
    }

    // normalizeConfig: an unset prefetch takes the broker default, then is
    // raised to the lane count; a named one below it fails validation.
    function resolveSubscriptionPrefetch(sub) {
      const lanes = subscriptionLaneCount(sub.topics.length, sub.priorities.length, sub.maxAttempts);
      if (sub.prefetch === null) {
        return { value: Math.max(brokerDefaultPrefetch, lanes), named: false, lanes, source: `unset: default ${brokerDefaultPrefetch}, at least ${lanes} lanes` };
      }
      if (sub.prefetch < lanes) {
        return { error: `f1: subscriptions.orders.prefetch ${sub.prefetch} must be at least lane count ${lanes} (topics x priorities x (1 + retryTiers))`, lanes };
      }
      return { value: sub.prefetch, named: true, lanes, source: `named ${sub.prefetch}` };
    }

    function runnerConsumerPrefetch(configured, named, plan) {
      const total = plan.reduce((sum, lane) => sum + lane.capacity, 0);
      if (total < 1) return { value: configured, total, warned: false };
      const warned = configured > total && named;
      return { value: Math.min(configured, total), total, warned };
    }

    // =========================================================================
    // 3. F1 SCHEDULER (SAME PORT AS swrr_scheduler_simulator.html)
    // =========================================================================
    class Lane {
      constructor(spec) { this.spec = spec; this.items = []; }
      enqueue(item) {
        if (this.items.length >= this.spec.capacity) return false;
        this.items.push(item);
        return true;
      }
      pop() { return this.items.shift() || null; }
    }

    class Slot {
      constructor(id, weight) { this.id = id; this.weight = weight; this.lanes = []; this.cursor = 0; this.score = 0; }
      empty() { return this.lanes.every(l => l.items.length === 0); }
      pop() {
        for (let checked = 0; checked < this.lanes.length; checked++) {
          const index = (this.cursor + checked) % this.lanes.length;
          const lane = this.lanes[index];
          if (lane.items.length === 0) continue;
          this.cursor = (index + 1) % this.lanes.length;
          return { item: lane.pop(), lane };
        }
        return null;
      }
    }

    class Scheduler {
      constructor(specs, clock) {
        this.clock = clock;
        this.slots = [];
        this.byID = new Map();
        const byGroup = new Map();
        for (const spec of specs) {
          const lane = new Lane(spec);
          this.byID.set(spec.id, lane);
          let slot = byGroup.get(spec.group);
          if (!slot) {
            slot = new Slot(spec.group, spec.weight);
            byGroup.set(spec.group, slot);
            this.slots.push(slot);
          }
          slot.lanes.push(lane);
        }
      }
      next() {
        const promo = this.mostOverdue();
        if (promo) return { item: promo.pop(), lane: promo };
        let selected = null;
        let totalWeight = 0;
        for (const group of this.slots) {
          if (group.empty()) { group.score = 0; continue; }
          group.score += group.weight;
          totalWeight += group.weight;
          if (selected === null || group.score > selected.score) selected = group;
        }
        if (selected === null) return null;
        selected.score -= totalWeight;
        return selected.pop();
      }
      mostOverdue() {
        const now = this.clock.now();
        let selected = null;
        let selectedOverrun = -1;
        for (const group of this.slots) {
          let groupEmpty = true;
          for (const lane of group.lanes) {
            if (lane.items.length === 0) continue;
            groupEmpty = false;
            if (lane.spec.budget <= 0) continue;
            const overrun = (now - lane.items[0].enqueuedAt) - lane.spec.budget;
            if (overrun < 0) continue;
            if (selected !== null && overrun <= selectedOverrun) continue;
            selected = lane;
            selectedOverrun = overrun;
          }
          if (groupEmpty) group.score = 0;
        }
        return selected;
      }
    }

    // =========================================================================
    // 4. SCENARIOS & ORCHESTRATOR
    // =========================================================================
    const scenarios = {
      defaults: {
        desc: "Shipped defaults: 16 workers, weights 8/4/1, divisor 2, factor 2, 4 attempts. Twelve lanes sum to 88, so the unset prefetch of 64 stays the in-flight budget.",
        cfg: { concurrency: 16, prefetch: "", topics: 1, priorities: "high, medium, low", weights: "8, 4, 1", divisor: 2, factor: 2, attempts: 4, driver: "rabbitmq", partitions: 12 },
      },
      bigprefetch: {
        desc: "A named Prefetch of 200 is capped at the sum of the lane capacities (88). The driver would fetch work no lane can hold, so F1 logs a warning and uses 88.",
        cfg: { concurrency: 16, prefetch: 200, topics: 1, priorities: "high, medium, low", weights: "8, 4, 1", divisor: 2, factor: 2, attempts: 4, driver: "rabbitmq", partitions: 12 },
      },
      floor: {
        desc: "At Concurrency 1 every weighted share rounds to one, so minimumLaneCapacity (3) binds: every lane gets 3 x factor 2 = 6.",
        cfg: { concurrency: 1, prefetch: "", topics: 1, priorities: "high, medium, low", weights: "8, 4, 1", divisor: 2, factor: 2, attempts: 4, driver: "rabbitmq", partitions: 12 },
      },
      kafka: {
        desc: "A partition-bound driver admits one delivery per owned partition. With 4 partitions, 16 workers and a prefetch of 64 still run at most 4 handlers.",
        cfg: { concurrency: 16, prefetch: "", topics: 1, priorities: "high, medium, low", weights: "8, 4, 1", divisor: 2, factor: 2, attempts: 4, driver: "kafka", partitions: 4 },
      },
      tooSmall: {
        desc: "A named Prefetch must cover every topic, priority and retry lane. 8 is below the 12 lanes, so the configuration is rejected at load.",
        cfg: { concurrency: 16, prefetch: 8, topics: 1, priorities: "high, medium, low", weights: "8, 4, 1", divisor: 2, factor: 2, attempts: 4, driver: "rabbitmq", partitions: 12 },
      },
    };

    const HANDLER_MS = 900;
    const PRIORITY_COLOR = { high: "var(--color-high)", medium: "var(--color-medium)", low: "var(--color-low)" };
    const clock = new VirtualClock();
    let currentScenario = "defaults";
    let sub = null;
    let model = null;
    let scheduler = null;
    let outstanding = new Map();
    let workers = [];
    let delivered = 0;
    let rr = 0;
    let particles = [];
    let isPlaying = true;
    let speedFactor = 1.0;

    const inputs = {
      concurrency: "cfg-concurrency", prefetch: "cfg-prefetch", topics: "cfg-topics", priorities: "cfg-priorities",
      weights: "cfg-weights", divisor: "cfg-divisor", factor: "cfg-factor", attempts: "cfg-attempts", driver: "cfg-driver", partitions: "cfg-partitions",
    };

    function writeInputs(cfg) {
      for (const [key, id] of Object.entries(inputs)) document.getElementById(id).value = cfg[key];
    }

    function readInputs() {
      const v = (key) => document.getElementById(inputs[key]).value;
      const int = (key, fallback) => { const n = parseInt(v(key), 10); return Number.isFinite(n) ? n : fallback; };
      const priorities = v("priorities").split(",").map(s => s.trim()).filter(p => ["high", "medium", "low"].includes(p));
      const w = v("weights").split(",").map(s => parseInt(s, 10) || 0);
      const topics = ["orders", "billing"].slice(0, Math.min(Math.max(int("topics", 1), 1), 2));
      return {
        concurrency: Math.min(Math.max(int("concurrency", 16), 1), 64),
        prefetch: v("prefetch") === "" ? null : int("prefetch", 0),
        topics,
        priorities: priorities.length ? [...new Set(priorities)] : ["high", "medium", "low"],
        weights: { high: w[0] || 0, medium: w[1] || 0, low: w[2] || 0 },
        divisor: int("divisor", 0),
        factor: int("factor", 0),
        maxAttempts: Math.min(Math.max(int("attempts", 4), 1), 6),
        driver: v("driver"),
        partitions: Math.max(int("partitions", 1), 1),
      };
    }

    function setScenario(sc) {
      currentScenario = sc;
      document.querySelectorAll(".scenario-tab").forEach(t => t.classList.toggle("active", t.dataset.scenario === sc));
      document.getElementById("scenario-desc").textContent = scenarios[sc].desc;
      writeInputs(scenarios[sc].cfg);
      reset();
    }

    function reset() {
      sub = readInputs();
      const lanePlan = runnerLanePlan(sub);
      const resolved = resolveSubscriptionPrefetch(sub);
      model = { ...lanePlan, resolved };
      if (!resolved.error) {
        model.prefetch = runnerConsumerPrefetch(resolved.value, resolved.named, lanePlan.plan);
        model.inflightCap = sub.driver === "kafka" ? Math.min(model.prefetch.value, sub.partitions) : model.prefetch.value;
        model.parallel = Math.min(sub.concurrency, model.inflightCap);
      }
      scheduler = new Scheduler(lanePlan.plan, clock);
      outstanding = new Map(lanePlan.plan.map(l => [l.id, 0]));
      workers = Array.from({ length: sub.concurrency }, () => ({ item: null, remaining: 0 }));
      delivered = 0;
      rr = 0;
      particles = [];
      buildLayout();
      renderBanner();
    }

    function inFlight() {
      let total = 0;
      for (const n of outstanding.values()) total += n;
      return total;
    }

    function simulationStep(deltaMs) {
      clock.advance(deltaMs);
      if (!model || model.resolved.error) return;

      // Handlers finish and settle; settlement frees the destination's window.
      for (const w of workers) {
        if (!w.item) continue;
        w.remaining -= deltaMs;
        if (w.remaining <= 0) {
          outstanding.set(w.item.lane, outstanding.get(w.item.lane) - 1);
          w.item = null;
        }
      }

      // Delivery: each destination may hold its lane capacity unsettled, and
      // the consumer as a whole its effective prefetch (one per partition on
      // Kafka). Destinations are visited round robin, one delivery each pass.
      const plan = model.plan;
      for (let i = 0; i < plan.length; i++) {
        const lane = plan[(rr + i) % plan.length];
        if (inFlight() >= model.inflightCap) break;
        if (outstanding.get(lane.id) >= lane.capacity) continue;
        if (scheduler.byID.get(lane.id).enqueue({ lane: lane.id, enqueuedAt: clock.now() })) {
          outstanding.set(lane.id, outstanding.get(lane.id) + 1);
          delivered++;
          particles.push({ type: "in", lane: lane.id, progress: 0, color: PRIORITY_COLOR[lane.priority] });
        }
      }
      rr = (rr + 1) % Math.max(plan.length, 1);

      // Dispatch: start work while a handler slot is free.
      for (let index = 0; index < workers.length; index++) {
        const w = workers[index];
        if (w.item) continue;
        const pick = scheduler.next();
        if (!pick) break;
        w.item = pick.item;
        w.remaining = HANDLER_MS * (0.7 + Math.random() * 0.6);
        particles.push({ type: "out", lane: pick.item.lane, worker: index, progress: 0, color: PRIORITY_COLOR[pick.lane.spec.priority] });
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].progress += 0.035 * (deltaMs / 16.67) / Math.max(1, speedFactor / 2);
        if (particles[i].progress >= 1) particles.splice(i, 1);
      }
    }

    // =========================================================================
    // 5. RENDERER
    // =========================================================================
    const svgNS = "http://www.w3.org/2000/svg";
    const tooltip = document.getElementById("tooltip");
    const stageBox = document.getElementById("stage-box");
    let laneY = new Map();
    let slotPos = [];
    let rowH = 24;

    function el(tag, attrs, parent, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [k, v] of Object.entries(attrs)) if (v !== undefined) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      if (parent) parent.appendChild(node);
      return node;
    }

    function fmt(ms) {
      return ms >= 60000 && ms % 60000 === 0 ? `${ms / 60000}m` : `${ms / 1000}s`;
    }

    function buildLayout() {
      const wires = document.getElementById("wires-layer");
      const lanesLayer = document.getElementById("lanes-layer");
      const poolLayer = document.getElementById("pool-layer");
      [wires, lanesLayer, poolLayer].forEach(l => { l.innerHTML = ""; });
      laneY = new Map();

      el("path", { d: "M 200 230 L 250 230", class: "wire-path" }, wires);

      const plan = model.plan;
      const top = 64, bottom = 410;
      rowH = Math.min(30, (bottom - top) / Math.max(plan.length, 1));
      const maxCap = Math.max(...plan.map(l => l.capacity), 1);
      [[420, "lane (Go sorts IDs)"], [600, "weight"], [638, "budget"], [680, "unsettled / capacity"]].forEach(([x, label]) => {
        el("text", { x, y: 58, "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)" }, lanesLayer, label);
      });
      plan.forEach((lane, i) => {
        const y = top + 8 + i * rowH + rowH / 2;
        laneY.set(lane.id, y);
        el("path", { d: `M 350 230 C 375 230, 375 ${y}, 400 ${y}`, class: "wire-path", opacity: 0.35 }, wires);
        el("path", { d: `M 880 ${y} C 905 ${y}, 905 230, 930 230`, class: "wire-path", opacity: 0.35 }, wires);
        const g = el("g", { transform: `translate(400, ${y - rowH / 2 + 1})`, class: "lane-row", "data-lane": lane.id }, lanesLayer);
        el("rect", { width: 480, height: rowH - 2, rx: 5, class: "box" }, g);
        const ty = rowH / 2 + 3;
        el("circle", { cx: 10, cy: rowH / 2 - 1, r: 3, fill: PRIORITY_COLOR[lane.priority] }, g);
        el("text", { x: 20, y: ty, "font-family": "var(--font-mono)", "font-size": Math.min(9.5, rowH / 2.4), "font-weight": lane.tier ? 400 : 600, fill: lane.tier ? "var(--text-secondary)" : undefined }, g, lane.id);
        el("text", { x: 200, y: ty, "font-family": "var(--font-mono)", "font-size": Math.min(9, rowH / 2.5), fill: "var(--text-muted)" }, g, `w${lane.weight}`);
        el("text", { x: 238, y: ty, "font-family": "var(--font-mono)", "font-size": Math.min(9, rowH / 2.5), fill: "var(--text-muted)" }, g, fmt(lane.budget));
        el("rect", { x: 280, y: rowH / 2 - 4, width: 150, height: 6, rx: 3, class: "tray" }, g);
        el("rect", { x: 280, y: rowH / 2 - 4, width: 150 * lane.capacity / maxCap, height: 6, rx: 3, fill: "none", stroke: "var(--text-muted)", "stroke-dasharray": "2 2" }, g);
        el("rect", { x: 280, y: rowH / 2 - 4, width: 0, height: 6, rx: 3, fill: PRIORITY_COLOR[lane.priority], id: `occ-${lane.id}` }, g);
        el("text", { x: 470, y: ty, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": Math.min(9.5, rowH / 2.4), "font-weight": 700, id: `cap-${lane.id}` }, g, `${lane.capacity}`);
      });

      // Handler slots: 8 per row.
      const n = sub.concurrency;
      const cols = Math.min(8, n);
      const rowsN = Math.ceil(n / 8);
      const size = 22, gap = 6;
      const width = cols * size + (cols - 1) * gap;
      const height = rowsN * size + (rowsN - 1) * gap;
      const x0 = 1045 - width / 2, y0 = 230 - height / 2;
      el("rect", { x: 930, y: Math.min(y0 - 40, 150), width: 230, height: Math.max(height + 80, 160), rx: 10, class: "box" }, poolLayer);
      el("text", { x: 944, y: Math.min(y0 - 40, 150) + 20, "font-family": "var(--font-mono)", "font-size": 10, "font-weight": 600 }, poolLayer, `Concurrency ${n}`);
      el("text", { x: 1146, y: Math.min(y0 - 40, 150) + 20, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--text-muted)", id: "txt-busy" }, poolLayer, "");
      slotPos = [];
      for (let i = 0; i < n; i++) {
        const x = x0 + (i % 8) * (size + gap);
        const y = y0 + Math.floor(i / 8) * (size + gap);
        slotPos.push({ x: x + size / 2, y: y + size / 2 });
        el("rect", { x, y, width: size, height: size, rx: 4, class: "worker-slot", id: `slot-${i}` }, poolLayer);
      }
      if (sub.driver === "kafka") {
        el("text", { x: 1045, y: Math.max(y0 + height + 30, 290), "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--color-promo)" }, poolLayer, `${sub.partitions} partitions: at most ${sub.partitions} in flight`);
      }
    }

    function renderBanner() {
      const banner = document.getElementById("banner");
      banner.className = "banner";
      if (model.resolved.error) {
        banner.className = "banner error";
        banner.textContent = model.resolved.error;
      } else if (model.prefetch.warned) {
        banner.className = "banner warn";
        banner.textContent = `WARN f1 configured prefetch exceeds the destination windows subscription=orders configured=${model.resolved.value} effective=${model.prefetch.value}`;
      }
    }

    function render() {
      document.getElementById("clock-display").textContent = clock.format();
      const error = model.resolved.error;
      const inflight = inFlight();
      const cap = error ? 0 : model.inflightCap;

      document.getElementById("txt-driver").textContent = sub.driver === "kafka" ? `kafka, ${sub.partitions} partitions` : "rabbitmq";
      document.getElementById("txt-delivered").textContent = `delivered ${delivered}`;
      document.getElementById("txt-prefetch").textContent = error ? "invalid" : model.prefetch.value;
      document.getElementById("txt-prefetch").setAttribute("fill", error ? "var(--color-break)" : "var(--text-primary)");
      document.getElementById("txt-inflight").textContent = `${inflight} in flight`;
      document.getElementById("txt-prefetch-src").textContent = error ? "" : model.resolved.source.split(":")[0];
      const fill = cap ? 240 * Math.min(1, inflight / cap) : 0;
      const fillEl = document.getElementById("prefetch-fill");
      fillEl.setAttribute("y", 284 - fill);
      fillEl.setAttribute("height", fill);

      const maxCap = Math.max(...model.plan.map(l => l.capacity), 1);
      for (const lane of model.plan) {
        const occ = document.getElementById(`occ-${lane.id}`);
        if (occ) occ.setAttribute("width", 150 * (outstanding.get(lane.id) || 0) / maxCap);
      }

      let busy = 0;
      workers.forEach((w, i) => {
        const slot = document.getElementById(`slot-${i}`);
        if (!slot) return;
        slot.classList.toggle("busy", !!w.item);
        if (w.item) busy++;
      });
      document.getElementById("txt-busy").textContent = `${busy} busy`;

      document.getElementById("particles-layer").innerHTML = particles.map(p => {
        const ly = laneY.get(p.lane);
        if (ly === undefined) return "";
        let x, y;
        if (p.type === "in") {
          x = 350 + p.progress * 50;
          y = 230 + (ly - 230) * Math.min(1, p.progress * 1.2);
        } else {
          const target = slotPos[p.worker] || { x: 1045, y: 230 };
          if (p.progress < 0.3) { x = 880 + (p.progress / 0.3) * 50; y = ly + (230 - ly) * (p.progress / 0.3); }
          else { const u = (p.progress - 0.3) / 0.7; x = 930 + (target.x - 930) * u; y = 230 + (target.y - 230) * u; }
        }
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${p.color}" filter="url(#glow)" />`;
      }).join("");

      // HUD.
      if (error) {
        document.getElementById("hud-prefetch").textContent = "INVALID";
        document.getElementById("hud-prefetch").style.color = "var(--color-break)";
        document.getElementById("hud-prefetch-sub").textContent = `named prefetch below the ${model.resolved.lanes} lanes`;
      } else {
        document.getElementById("hud-prefetch").textContent = model.prefetch.value;
        document.getElementById("hud-prefetch").style.color = "var(--text-primary)";
        document.getElementById("hud-prefetch-sub").textContent = `min(configured ${model.resolved.value}, lane sum ${model.prefetch.total})`;
      }
      document.getElementById("gauge-prefetch").style.width = cap ? `${Math.min(100, (inflight / cap) * 100)}%` : "0%";
      document.getElementById("hud-lanes").textContent = `${model.plan.length} / ${model.totalWeight}`;
      document.getElementById("hud-lanes-sub").textContent = `capacity = max(ceil(${sub.concurrency} x w / ${model.totalWeight}), ${minimumLaneCapacity}) x ${model.factor}; retry weight = w / ${model.divisor}`;
      document.getElementById("hud-parallel").textContent = error ? "0" : `${busy} / ${model.parallel}`;
      document.getElementById("hud-parallel-sub").textContent = error ? "the subscription does not start" : (sub.driver === "kafka" ? `min(Concurrency ${sub.concurrency}, partitions ${sub.partitions}, prefetch ${model.prefetch.value})` : `min(Concurrency ${sub.concurrency}, prefetch ${model.prefetch.value})`);
      document.getElementById("gauge-parallel").style.width = !error && model.parallel ? `${(busy / model.parallel) * 100}%` : "0%";

      let name = "-", why = "";
      if (error) { name = "CONFIG"; why = "validation rejects the subscription before it opens"; }
      else {
        const ceilings = [
          { name: "CONCURRENCY", value: sub.concurrency, why: "handler slots" },
          { name: "PREFETCH", value: model.prefetch.value, why: model.prefetch.value < model.resolved.value ? "capped at the lane sum" : "configured in-flight budget" },
        ];
        if (sub.driver === "kafka") ceilings.push({ name: "PARTITIONS", value: sub.partitions, why: "one delivery per owned partition" });
        const tight = ceilings.reduce((a, b) => (b.value < a.value ? b : a));
        name = tight.name;
        why = `${tight.value}: ${tight.why}`;
      }
      document.getElementById("hud-bottleneck").textContent = name;
      document.getElementById("hud-bottleneck-sub").textContent = why;
    }

    stageBox.addEventListener("mouseover", (e) => {
      const row = e.target.closest(".lane-row");
      if (!row) return;
      const lane = model.plan.find(l => l.id === row.dataset.lane);
      tooltip.innerHTML = `
        <div style="font-weight:600; margin-bottom:4px;">${lane.id}</div>
        <div style="color: var(--text-secondary);">group: <span style="color:#fff;">${lane.group}</span></div>
        <div style="color: var(--text-secondary);">weight ${lane.weight}, budget ${fmt(lane.budget)}</div>
        <div style="color: var(--text-secondary);">max(ceil(${sub.concurrency} x ${lane.weight} / ${model.totalWeight}), ${minimumLaneCapacity}) x ${model.factor} = <span style="color:#fff;">${lane.capacity}</span></div>
        <div style="margin-top:4px; font-size:10px; color: var(--text-muted);">unsettled now: ${outstanding.get(lane.id) || 0}</div>`;
      tooltip.classList.add("visible");
    });
    stageBox.addEventListener("mousemove", (e) => {
      const rect = stageBox.getBoundingClientRect();
      tooltip.style.left = `${e.clientX - rect.left + 16}px`;
      tooltip.style.top = `${e.clientY - rect.top + 16}px`;
    });
    stageBox.addEventListener("mouseout", (e) => {
      if (e.target.closest(".lane-row")) tooltip.classList.remove("visible");
    });

    document.getElementById("btn-play-pause").addEventListener("click", () => {
      isPlaying = !isPlaying;
      document.getElementById("play-text").textContent = isPlaying ? "Pause" : "Play";
    });
    document.getElementById("btn-step").addEventListener("click", () => {
      if (!isPlaying) { simulationStep(100); render(); }
    });
    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        speedFactor = parseFloat(btn.dataset.speed);
      });
    });
    document.querySelectorAll(".scenario-tab").forEach(tab => tab.addEventListener("click", () => setScenario(tab.dataset.scenario)));
    document.querySelectorAll(".config-row input, .config-row select").forEach(input => input.addEventListener("change", reset));

    let lastFrameTime = performance.now();
    document.addEventListener("visibilitychange", () => { lastFrameTime = performance.now(); });
    function loop(currentTime) {
      if (document.hidden) {
        lastFrameTime = currentTime;
        requestAnimationFrame(loop);
        return;
      }
      const delta = Math.min(currentTime - lastFrameTime, 100);
      lastFrameTime = currentTime;
      if (isPlaying) simulationStep(delta * speedFactor);
      render();
      requestAnimationFrame(loop);
    }

    setScenario("defaults");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
