<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>f1 SDK - Retry Ladder Simulator</title>
  <style>
    :root {
      --bg-canvas: #09090b;
      --bg-surface: #111115;
      --bg-surface-glass: rgba(17, 17, 21, 0.75);
      --border-subtle: #222228;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --text-primary: #f4f4f6;
      --text-secondary: #9090a0;
      --text-muted: #555562;

      --color-high: #38bdf8;
      --color-medium: #818cf8;
      --color-low: #94a3b8;
      --color-promo: #f59e0b;
      --color-worker: #10b981;
      --color-break: #f43f5e;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Geist", "Inter", sans-serif;
      --font-mono: "Geist Mono", "JetBrains Mono", "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      background-image: radial-gradient(var(--border-subtle) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    header {
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border-hairline);
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 12px; }

    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #000;
    }

    .brand-title { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; }
    .brand-sub { color: var(--text-muted); font-size: 12px; margin-left: 6px; font-family: var(--font-mono); }

    .controls-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-hairline);
      border-radius: 9999px;
      padding: 4px 10px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .btn-pill {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 6px 12px;
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-pill:hover { color: var(--text-primary); background: rgba(255, 255, 255, 0.05); }
    .btn-pill.active { color: var(--text-primary); background: rgba(255, 255, 255, 0.1); }

    .divider { width: 1px; height: 14px; background: var(--border-hairline); }

    .clock-tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); padding: 0 6px; }

    main {
      flex: 1;
      padding: 24px 36px 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .scenarios-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 4px 8px;
    }

    .tab-row { display: flex; gap: 12px; flex-wrap: wrap; }

    .scenario-tabs {
      display: flex;
      gap: 6px;
      background: rgba(17, 17, 21, 0.6);
      border: 1px solid var(--border-hairline);
      padding: 3px;
      border-radius: 8px;
    }

    .scenario-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-family: var(--font-sans);
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .scenario-tab:hover { color: var(--text-secondary); }
    .scenario-tab.active { color: var(--text-primary); background: #1e1e24; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3); }

    .scenario-desc { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); max-width: 620px; line-height: 1.5; }

    .stage-container {
      position: relative;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    svg.runtime-svg { width: 100%; height: auto; display: block; }
    svg text { user-select: none; }
    svg text:not([fill]) { fill: var(--text-primary); }

    .wire-path { fill: none; stroke: var(--border-subtle); stroke-width: 1.5; }

    .box {
      fill: #141419;
      stroke: var(--border-hairline);
      stroke-width: 1;
    }

    .tray { fill: #0d0d12; stroke: var(--border-hairline); }

    .worker-slot { fill: #141419; stroke: var(--border-hairline); stroke-width: 1; transition: all 0.2s ease; }
    .worker-slot.busy { stroke: var(--color-worker); fill: rgba(16, 185, 129, 0.05); }

    .hud-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    @media (max-width: 900px) {
      .hud-grid { grid-template-columns: repeat(2, 1fr); }
      header, main { padding-left: 16px; padding-right: 16px; }
    }

    .hud-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .hud-label { font-size: 11px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .hud-value { font-size: 18px; font-family: var(--font-mono); font-weight: 600; }
    .hud-sub { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }

    .gauge-bar { width: 100%; height: 3px; background: var(--border-subtle); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .gauge-fill { height: 100%; background: var(--color-high); transition: width 0.2s ease; }

    #tooltip {
      position: absolute;
      background: rgba(17, 17, 21, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-family: var(--font-mono);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 200;
      max-width: 280px;
    }

    #tooltip.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 700px) {
      .controls-pill, .scenario-tabs { flex-wrap: wrap; border-radius: 12px; }
      .brand-sub { display: none; }
      .stage-container { overflow-x: auto; }
      svg.runtime-svg { min-width: 720px; }
    }

    .config-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 0 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .config-row label { display: flex; align-items: center; gap: 6px; }

    .config-row input {
      width: 64px;
      background: #0d0d12;
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 5px 8px;
    }

    .config-row input.wide { width: 160px; }
    .config-row input:focus { outline: 1px solid var(--color-high); }

    .rule-row { transition: all 0.2s ease; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-logo">f1</div>
      <div class="brand-title">event-driven-messaging-sdk</div>
      <div class="brand-sub">/ internal/retry / Retry Ladder &amp; Settlement Simulator</div>
    </div>

    <div class="controls-pill">
      <button class="btn-pill" id="btn-play-pause"><span id="play-text">Pause</span></button>
      <button class="btn-pill" id="btn-step">Step</button>
      <div class="divider"></div>
      <button class="btn-pill speed-btn" data-speed="0.5">0.5x</button>
      <button class="btn-pill speed-btn active" data-speed="1.0">1.0x</button>
      <button class="btn-pill speed-btn" data-speed="2.0">2.0x</button>
      <button class="btn-pill speed-btn" data-speed="4.0">4.0x</button>
      <button class="btn-pill speed-btn" data-speed="8.0">8.0x</button>
      <div class="divider"></div>
      <span class="clock-tag" id="clock-display">T = 00:00.00</span>
    </div>
  </header>

  <main>
    <div class="scenarios-bar">
      <div class="scenario-tabs">
        <button class="scenario-tab active" data-scenario="defaults">Default Ladder</button>
        <button class="scenario-tab" data-scenario="tiers">Explicit Tiers</button>
        <button class="scenario-tab" data-scenario="retryafter">RetryAfter Routing</button>
        <button class="scenario-tab" data-scenario="poison">Poison Counter</button>
      </div>
      <div class="scenario-desc" id="scenario-desc"></div>
    </div>

    <div class="config-row">
      <span>Retry:</span>
      <label>MaxAttempts <input id="cfg-max" type="number" min="0" max="20" step="1" /></label>
      <label>InitialInterval (s) <input id="cfg-initial" type="number" min="0" step="0.5" /></label>
      <label>Multiplier <input id="cfg-mult" type="number" min="0" step="0.5" /></label>
      <label>MaxInterval (s) <input id="cfg-maxint" type="number" min="0" step="1" /></label>
      <label>Tiers (s, comma) <input id="cfg-tiers" class="wide" type="text" placeholder="empty = exponential" /></label>
    </div>

    <div class="stage-container" id="stage-box">
      <svg class="runtime-svg" id="svg-canvas" viewBox="0 0 1200 480">
        <defs>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
        </defs>

        <g fill="var(--text-secondary)" opacity="0.85" font-family="var(--font-mono)" font-size="10" font-weight="600" letter-spacing="0.08em" text-anchor="middle">
          <text x="130" y="42">01 / HANDLER</text>
          <text x="425" y="42">02 / CLASSIFY (worker.go)</text>
          <text x="790" y="42">03 / RETRY TIERS (DelayFor)</text>
          <text x="1090" y="42">04 / SETTLED</text>
        </g>

        <g id="wires-layer"></g>

        <!-- Inbound: fresh deliveries and returning retry copies. -->
        <g transform="translate(40, 64)">
          <rect width="180" height="70" rx="10" class="box" />
          <text x="14" y="20" font-family="var(--font-mono)" font-size="10" font-weight="600">inbound</text>
          <text id="txt-inbound" x="166" y="20" text-anchor="end" font-family="var(--font-mono)" font-size="8.5" fill="var(--text-muted)">0 waiting</text>
          <rect x="14" y="30" width="152" height="26" rx="4" class="tray" />
          <g id="items-inbound" transform="translate(30, 43)"></g>
        </g>

        <g id="workers-layer"></g>
        <g id="rules-layer"></g>
        <g id="tiers-layer"></g>
        <g id="sinks-layer"></g>
        <g id="particles-layer"></g>
      </svg>
    </div>

    <div class="hud-grid">
      <div class="hud-card">
        <span class="hud-label">Ladder (DelayFor)</span>
        <div class="hud-value" id="hud-ladder">-</div>
        <div class="hud-sub" id="hud-ladder-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" style="width: 100%;"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Last Decision</span>
        <div class="hud-value" id="hud-decision">-</div>
        <div class="hud-sub" id="hud-decision-sub">Waiting for the first settlement</div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-decision" style="width: 0%; background: var(--color-promo);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Acked / Dead-Lettered</span>
        <div class="hud-value" id="hud-settled">0 / 0</div>
        <div class="hud-sub" id="hud-settled-sub"></div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-settled" style="width: 0%; background: var(--color-worker);"></div></div>
      </div>
      <div class="hud-card">
        <span class="hud-label">Retry Copies Parked</span>
        <div class="hud-value" id="hud-parked">0</div>
        <div class="hud-sub">Owned by the broker: the source was acked once the copy was confirmed</div>
        <div class="gauge-bar"><div class="gauge-fill" id="gauge-parked" style="width: 0%; background: var(--color-promo);"></div></div>
      </div>
    </div>
  </main>

  <div id="tooltip"></div>

  <script>
    // =========================================================================
    // 1. DETERMINISTIC VIRTUAL CLOCK
    // =========================================================================
    class VirtualClock {
      constructor() { this.currentMs = 0; }
      now() { return this.currentMs; }
      advance(ms) { this.currentMs += ms; }
      format() {
        const totalSec = Math.floor(this.currentMs / 1000);
        const mins = Math.floor(totalSec / 60).toString().padStart(2, "0");
        const secs = (totalSec % 60).toString().padStart(2, "0");
        const frac = Math.floor((this.currentMs % 1000) / 10).toString().padStart(2, "0");
        return `T = ${mins}:${secs}.${frac}`;
      }
    }

    // =========================================================================
    // 2. F1 RETRY LADDER (1:1 PORT OF internal/retry/ladder.go AND sanity.go)
    // =========================================================================
    // Durations are milliseconds here; Go uses nanoseconds.
    const MAX_DURATION_MS = 9223372036854.775;

    class RetryConfig {
      constructor({ maxAttempts, initialInterval, multiplier, maxInterval, tiers }) {
        this.maxAttempts = maxAttempts;
        this.initialInterval = initialInterval;
        this.multiplier = multiplier;
        this.maxInterval = maxInterval;
        this.tiers = tiers;
      }

      // DelayFor returns the nominal delay for a one-based retry number.
      delayFor(attempt) {
        if (attempt < 1) attempt = 1;
        if (this.tiers.length > 0) {
          let index = attempt - 1;
          if (index >= this.tiers.length) index = this.tiers.length - 1;
          return this.tiers[index];
        }
        let initial = this.initialInterval;
        if (initial <= 0) initial = 1000;
        let multiplier = this.multiplier;
        if (multiplier === 0) multiplier = 5;
        let delay = initial;
        for (let i = 1; i < attempt; i++) {
          if (this.maxInterval > 0 && delay >= this.maxInterval) return this.maxInterval;
          const next = delay * multiplier;
          if (next <= 0 || next >= MAX_DURATION_MS) return this.maxInterval;
          delay = Math.trunc(next * 1e6) / 1e6;
        }
        if (this.maxInterval > 0 && delay > this.maxInterval) return this.maxInterval;
        return delay;
      }

      // TierCount returns the number of retry destinations.
      tierCount() {
        if (this.tiers.length > 0) return this.tiers.length;
        if (this.maxAttempts <= 1) return 0;
        return this.maxAttempts - 1;
      }
    }

    // ResolveTier selects the ordinary retry tier for a one-based attempt.
    function resolveTier(c, attempt) {
      const count = c.tierCount();
      if (count === 0) return 0;
      if (attempt < 1) attempt = 1;
      if (attempt > count) return count;
      return attempt;
    }

    // ResolveRetryAfter routes an explicit delay to its nearest nominal tier.
    // Ties keep the lower tier (strict <).
    function resolveRetryAfter(c, requested) {
      const count = c.tierCount();
      if (count === 0) return { tier: 0, delay: 0 };
      if (requested < 0) requested = 0;
      let tier = 1;
      let bestDistance = Math.abs(requested - c.delayFor(1));
      for (let candidate = 2; candidate <= count; candidate++) {
        const distance = Math.abs(requested - c.delayFor(candidate));
        if (distance < bestDistance) {
          tier = candidate;
          bestDistance = distance;
        }
      }
      return { tier, delay: c.delayFor(tier) };
    }

    const SANITY_MARGIN = 10;
    // CounterRunaway: the attempt counter exceeded its limit by the margin.
    function counterRunaway(attempt, maxAttempts) {
      return maxAttempts > 0 && attempt > maxAttempts + SANITY_MARGIN;
    }

    // =========================================================================
    // 3. SETTLEMENT DECISION (PORT OF dispatchMessage AND retryAndSettle)
    // =========================================================================
    // Returns the rule index that fired plus the settlement it asks for.
    const RULES = [
      { test: "attempt > max + 10", then: "DLQ poison", sink: "dlq", reason: "poison" },
      { test: "handler panicked", then: "DLQ panic", sink: "dlq", reason: "panic" },
      { test: "err == nil", then: "ack", sink: "ack" },
      { test: "IsTerminal(err)", then: "DLQ terminal", sink: "dlq", reason: "terminal" },
      { test: "IsDropped(err)", then: "ack + Discarded", sink: "drop" },
      { test: "attempt >= max", then: "DLQ max_attempts", sink: "dlq", reason: "max_attempts" },
      { test: "RetryAfter(d)", then: "nearest tier", sink: "retry" },
      { test: "retryable", then: "ResolveTier(attempt)", sink: "retry" },
    ];

    function receiveCheck(cfg, msg) {
      // Runs before the handler: a runaway counter never reaches it.
      if (counterRunaway(msg.attempt, cfg.maxAttempts)) return { rule: 0, text: `attempt ${msg.attempt} > ${cfg.maxAttempts} + ${SANITY_MARGIN}` };
      return null;
    }

    function settle(cfg, msg, outcome) {
      if (outcome.kind === "panic") return { rule: 1, text: "recovered panic" };
      if (outcome.kind === "ok") return { rule: 2, text: "handler returned nil" };
      if (outcome.kind === "terminal") return { rule: 3, text: "f1.Terminal(err)" };
      if (outcome.kind === "drop") return { rule: 4, text: "f1.Drop(err)" };
      if (msg.attempt >= cfg.maxAttempts) return { rule: 5, text: `attempt ${msg.attempt} >= MaxAttempts ${cfg.maxAttempts}` };
      if (cfg.tierCount() === 0) return { rule: 5, text: "TierCount() == 0" };
      let tier = resolveTier(cfg, msg.attempt);
      let delay = cfg.delayFor(tier);
      if (outcome.kind === "retryafter") {
        const resolved = resolveRetryAfter(cfg, outcome.requested);
        return { rule: 6, tier: resolved.tier, delay: resolved.delay, text: `RetryAfter(${fmt(outcome.requested)}) -> tier ${resolved.tier} (${fmt(resolved.delay)})` };
      }
      return { rule: 7, tier, delay, text: `ResolveTier(${msg.attempt}) = ${tier} -> ${fmt(delay)}` };
    }

    // =========================================================================
    // 4. SCENARIOS & ORCHESTRATOR
    // =========================================================================
    const scenarios = {
      defaults: {
        desc: "Defaults: MaxAttempts 4, 1s x5 capped at 30s gives tiers 1s, 5s, 25s. The fourth failure dead-letters with max_attempts.",
        config: { maxAttempts: 4, initialInterval: 1, multiplier: 5, maxInterval: 30, tiers: "" },
        outcomes: { ok: 0.45, retryable: 0.44, terminal: 0.04, drop: 0.04, panic: 0.03 },
        rate: 0.9,
      },
      tiers: {
        desc: "Explicit Tiers replace the exponential ladder. With 3 tiers and MaxAttempts 6, attempts 3, 4 and 5 all park on the last tier.",
        config: { maxAttempts: 6, initialInterval: 1, multiplier: 5, maxInterval: 30, tiers: "2, 8, 20" },
        outcomes: { ok: 0.3, retryable: 0.7 },
        rate: 0.7,
      },
      retryafter: {
        desc: "The handler asks for a delay with f1.RetryAfter. The request is routed to the nominal tier nearest to it, since only tiers have destinations.",
        config: { maxAttempts: 4, initialInterval: 1, multiplier: 5, maxInterval: 30, tiers: "" },
        outcomes: { ok: 0.3, retryafter: 0.7 },
        rate: 0.8,
      },
      poison: {
        desc: "Some deliveries carry an attempt header far above MaxAttempts. Above max + 10 is poison and never reaches the handler; below it, one failure dead-letters.",
        config: { maxAttempts: 4, initialInterval: 1, multiplier: 5, maxInterval: 30, tiers: "" },
        outcomes: { ok: 0.5, retryable: 0.5 },
        attemptHeaders: [1, 1, 1, 1, 6, 14, 15, 22],
        rate: 0.9,
      },
    };

    const clock = new VirtualClock();
    const HANDLER_MS = 700;
    const WORKERS = 2;
    const MSG_COLORS = ["#38bdf8", "#818cf8", "#34d399", "#f472b6", "#a3e635", "#fb923c"];
    let currentScenario = "defaults";
    let cfg = null;
    let inbound = [];
    let workers = [];
    let parked = [];
    let counts = {};
    let lastDecision = null;
    let particles = [];
    let nextId = 1;
    let isPlaying = true;
    let speedFactor = 1.0;

    function fmt(ms) {
      if (ms >= 60000 && ms % 60000 === 0) return `${ms / 60000}m`;
      if (ms >= 1000) return `${+(ms / 1000).toFixed(1)}s`;
      return `${Math.round(ms)}ms`;
    }

    function readConfig() {
      const num = (id) => parseFloat(document.getElementById(id).value) || 0;
      const tiers = document.getElementById("cfg-tiers").value.split(",").map(s => parseFloat(s)).filter(v => v > 0).map(v => v * 1000);
      return new RetryConfig({
        maxAttempts: Math.trunc(num("cfg-max")),
        initialInterval: num("cfg-initial") * 1000,
        multiplier: num("cfg-mult"),
        maxInterval: num("cfg-maxint") * 1000,
        tiers,
      });
    }

    function writeConfig(c) {
      document.getElementById("cfg-max").value = c.maxAttempts;
      document.getElementById("cfg-initial").value = c.initialInterval;
      document.getElementById("cfg-mult").value = c.multiplier;
      document.getElementById("cfg-maxint").value = c.maxInterval;
      document.getElementById("cfg-tiers").value = c.tiers;
    }

    function setScenario(sc) {
      currentScenario = sc;
      document.querySelectorAll(".scenario-tab").forEach(t => t.classList.toggle("active", t.dataset.scenario === sc));
      document.getElementById("scenario-desc").textContent = scenarios[sc].desc;
      writeConfig(scenarios[sc].config);
      reset();
    }

    function reset() {
      cfg = readConfig();
      inbound = [];
      parked = [];
      particles = [];
      lastDecision = null;
      counts = { ack: 0, drop: 0, dlq: 0, poison: 0, panic: 0, terminal: 0, max_attempts: 0, retries: 0 };
      workers = Array.from({ length: WORKERS }, (_, id) => ({ id, msg: null, remaining: 0, total: 0 }));
      buildLayout();
    }

    function sampleOutcome() {
      const table = scenarios[currentScenario].outcomes;
      let r = Math.random();
      for (const [kind, p] of Object.entries(table)) {
        if (r < p) {
          if (kind === "retryafter") return { kind, requested: Math.round(Math.random() * 40000) };
          return { kind };
        }
        r -= p;
      }
      return { kind: "ok" };
    }

    function arrivals(deltaMs) {
      const sc = scenarios[currentScenario];
      if (inbound.length >= 4) return;
      if (Math.random() < sc.rate * (deltaMs / 1000)) {
        const headers = sc.attemptHeaders;
        const attempt = headers ? headers[Math.floor(Math.random() * headers.length)] : 1;
        const id = nextId++;
        inbound.push({ id: `m${id}`, attempt, color: MSG_COLORS[id % MSG_COLORS.length], history: [] });
      }
    }

    function decide(worker, msg, decision) {
      const rule = RULES[decision.rule];
      lastDecision = { ...decision, msg: msg.id, attempt: msg.attempt, at: clock.now() };
      const from = { worker: worker.id, rule: decision.rule };
      if (rule.sink === "retry") {
        const copy = { ...msg, attempt: msg.attempt + 1, history: [...msg.history, fmt(decision.delay)] };
        parked.push({ msg: copy, tier: decision.tier, publishedAt: clock.now(), dueAt: clock.now() + decision.delay, delay: decision.delay });
        counts.retries++;
        particles.push({ type: "tier", ...from, tier: decision.tier, progress: 0, color: msg.color });
      } else {
        counts[rule.sink]++;
        if (rule.reason) counts[rule.reason]++;
        particles.push({ type: "sink", ...from, sink: rule.sink, progress: 0, color: rule.sink === "dlq" ? "var(--color-break)" : msg.color });
      }
    }

    function simulationStep(deltaMs) {
      clock.advance(deltaMs);
      arrivals(deltaMs);

      // Due copies come back as fresh deliveries.
      for (let i = parked.length - 1; i >= 0; i--) {
        if (clock.now() >= parked[i].dueAt) {
          const p = parked.splice(i, 1)[0];
          inbound.push(p.msg);
          particles.push({ type: "return", tier: p.tier, progress: 0, color: p.msg.color });
        }
      }

      for (const w of workers) {
        if (w.msg) {
          w.remaining -= deltaMs;
          if (w.remaining <= 0) {
            const msg = w.msg;
            w.msg = null;
            if (msg.poison) decide(w, msg, msg.poison);
            else decide(w, msg, settle(cfg, msg, sampleOutcome()));
          }
        }
        if (!w.msg && inbound.length > 0) {
          const msg = inbound.shift();
          msg.poison = receiveCheck(cfg, msg);
          w.msg = msg;
          w.total = w.remaining = msg.poison ? 200 : HANDLER_MS;
          particles.push({ type: "start", worker: w.id, progress: 0, color: msg.color });
        }
      }

      const stepProgress = 0.03 * (deltaMs / 16.67) / Math.max(1, speedFactor / 2);
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].progress += stepProgress;
        if (particles[i].progress >= 1) particles.splice(i, 1);
      }
    }

    // =========================================================================
    // 5. RENDERER
    // =========================================================================
    const svgNS = "http://www.w3.org/2000/svg";
    const tooltip = document.getElementById("tooltip");
    const stageBox = document.getElementById("stage-box");
    let paths = {};
    let tierY = [];
    const WORKER_Y = [180, 262];
    const RULE_Y = RULES.map((_, i) => 84 + i * 36);
    const SINK_Y = { ack: 104, drop: 176, dlq: 300 };

    function el(tag, attrs, parent, text) {
      const node = document.createElementNS(svgNS, tag);
      for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
      if (text !== undefined) node.textContent = text;
      if (parent) parent.appendChild(node);
      return node;
    }

    function wire(d, layer, hidden) {
      return el("path", { d, class: "wire-path", opacity: hidden ? 0 : 1 }, layer);
    }

    function buildLayout() {
      const wires = document.getElementById("wires-layer");
      const workersLayer = document.getElementById("workers-layer");
      const rulesLayer = document.getElementById("rules-layer");
      const tiersLayer = document.getElementById("tiers-layer");
      const sinksLayer = document.getElementById("sinks-layer");
      [wires, workersLayer, rulesLayer, tiersLayer, sinksLayer].forEach(l => { l.innerHTML = ""; });
      paths = { start: [], toRule: [], ruleToTier: {}, ruleToSink: {}, ret: [] };

      const count = Math.min(cfg.tierCount(), 6);
      const top = 84, bottom = 360;
      const step = count > 1 ? Math.min(56, (bottom - top) / (count - 1)) : 0;
      const span = step * (count - 1);
      tierY = Array.from({ length: count }, (_, i) => (top + bottom) / 2 - span / 2 + i * step);

      WORKER_Y.forEach((y, i) => {
        paths.start.push(wire(`M 130 134 C 130 150, 130 ${y - 40}, 130 ${y - 26}`, wires));
        const g = el("g", { transform: `translate(40, ${y - 26})` }, workersLayer);
        el("rect", { width: 180, height: 52, rx: 8, class: "worker-slot", id: `worker-rect-${i}` }, g);
        el("text", { x: 14, y: 20, "font-family": "var(--font-mono)", "font-size": 10, "font-weight": 600 }, g, `Worker #${i}`);
        el("text", { x: 166, y: 20, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)", id: `worker-state-${i}` }, g, "IDLE");
        el("rect", { x: 14, y: 34, width: 152, height: 3, rx: 1.5, fill: "#222228" }, g);
        el("rect", { x: 14, y: 34, width: 0, height: 3, rx: 1.5, fill: "var(--color-worker)", id: `worker-progress-${i}` }, g);
        paths.toRule.push(RULE_Y.map(ry => wire(`M 220 ${y} C 255 ${y}, 255 ${ry}, 290 ${ry}`, wires, true)));
      });

      el("rect", { x: 290, y: 64, width: 270, height: 300, rx: 10, class: "box" }, rulesLayer);
      RULES.forEach((rule, i) => {
        const y = RULE_Y[i];
        const g = el("g", { class: "rule-row", id: `rule-${i}`, transform: `translate(300, ${y - 14})` }, rulesLayer);
        el("rect", { width: 250, height: 28, rx: 6, fill: "#0d0d12", stroke: "var(--border-hairline)", id: `rule-rect-${i}` }, g);
        el("text", { x: 10, y: 18, "font-family": "var(--font-mono)", "font-size": 9.5, "font-weight": 600 }, g, rule.test);
        el("text", { x: 240, y: 18, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--text-muted)", id: `rule-then-${i}` }, g, rule.then);
        if (rule.sink === "retry") {
          tierY.forEach((ty, t) => { paths.ruleToTier[`${i}-${t + 1}`] = wire(`M 560 ${y} C 590 ${y}, 590 ${ty}, 620 ${ty}`, wires, true); });
        } else {
          const sy = SINK_Y[rule.sink];
          paths.ruleToSink[i] = wire(`M 560 ${y} C 700 ${y < 200 ? 56 : 452}, 900 ${y < 200 ? 56 : 452}, 1010 ${sy}`, wires, true);
        }
      });
      el("text", { x: 300, y: 382, "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)" }, rulesLayer, "Rows are checked top to bottom; the first match settles.");

      if (count === 0) {
        el("text", { x: 790, y: 210, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 11, fill: "var(--text-muted)" }, tiersLayer, "TierCount() == 0: every retryable error dead-letters");
      }
      tierY.forEach((y, t) => {
        const g = el("g", { transform: `translate(620, ${y - 20})` }, tiersLayer);
        el("rect", { width: 340, height: 40, rx: 8, class: "box", id: `tier-rect-${t + 1}` }, g);
        el("text", { x: 12, y: 16, "font-family": "var(--font-mono)", "font-size": 9.5, "font-weight": 600 }, g, `tier ${t + 1}`);
        el("text", { x: 328, y: 16, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--color-promo)" }, g, `DelayFor(${t + 1}) = ${fmt(cfg.delayFor(t + 1))}`);
        el("rect", { x: 12, y: 24, width: 316, height: 8, rx: 4, class: "tray" }, g);
        el("text", { x: 60, y: 16, "font-family": "var(--font-mono)", "font-size": 8.5, fill: "var(--text-muted)", id: `tier-count-${t + 1}` }, g, "");
        el("g", { id: `tier-items-${t + 1}`, transform: "translate(12, 28)" }, g);
        paths.ret.push(wire(`M 960 ${y} C 990 ${y}, 990 462, 940 462 L 60 462 C 16 462, 16 99, 40 99`, wires, true));
      });
      if (cfg.tierCount() > 6) {
        el("text", { x: 790, y: 380, "text-anchor": "middle", "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--text-muted)" }, tiersLayer, `+${cfg.tierCount() - 6} more tiers not drawn`);
      }

      const sink = (key, y, h, title) => {
        const g = el("g", { transform: `translate(1010, ${y - 28})` }, sinksLayer);
        el("rect", { width: 160, height: h, rx: 8, class: "box", id: `sink-rect-${key}` }, g);
        el("text", { x: 12, y: 18, "font-family": "var(--font-mono)", "font-size": 10, "font-weight": 600 }, g, title);
        el("text", { x: 148, y: 18, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 12, "font-weight": 700, id: `sink-count-${key}` }, g, "0");
        return g;
      };
      sink("ack", SINK_Y.ack, 50, "ack");
      sink("drop", SINK_Y.drop, 50, "ack + Discarded");
      const dlq = sink("dlq", SINK_Y.dlq, 110, "dead letter");
      ["max_attempts", "terminal", "panic", "poison"].forEach((reason, i) => {
        el("text", { x: 12, y: 40 + i * 17, "font-family": "var(--font-mono)", "font-size": 9, fill: "var(--text-muted)" }, dlq, reason);
        el("text", { x: 148, y: 40 + i * 17, "text-anchor": "end", "font-family": "var(--font-mono)", "font-size": 9, id: `dlq-${reason}` }, dlq, "0");
      });
    }

    function pointOn(path, t) {
      const len = path.getTotalLength();
      return path.getPointAtLength(Math.min(Math.max(t, 0), 1) * len);
    }

    function chip(x, y, msg) {
      return `<g transform="translate(${x}, ${y})" class="packet-node" data-id="${msg.id}" data-attempt="${msg.attempt}" data-history="${msg.history.join(" > ")}">
        <rect x="-15" y="-8" width="30" height="16" rx="4" fill="${msg.color}" fill-opacity="0.85" ${msg.attempt > 1 ? "stroke='var(--color-promo)' stroke-width='1.5'" : ""} />
        <text x="0" y="3.5" text-anchor="middle" font-family="var(--font-mono)" font-size="8.5" font-weight="700" fill="#09090b" pointer-events="none">${msg.id}</text>
      </g>`;
    }

    function render() {
      document.getElementById("clock-display").textContent = clock.format();

      document.getElementById("items-inbound").innerHTML = inbound.slice(0, 4).map((m, i) => chip(i * 36, 0, m)).join("");
      document.getElementById("txt-inbound").textContent = `${inbound.length} waiting`;

      workers.forEach(w => {
        const state = document.getElementById(`worker-state-${w.id}`);
        document.getElementById(`worker-rect-${w.id}`).classList.toggle("busy", !!w.msg);
        if (w.msg) {
          state.textContent = w.msg.poison ? `${w.msg.id} attempt ${w.msg.attempt} (header check)` : `${w.msg.id} attempt ${w.msg.attempt}/${cfg.maxAttempts}`;
          state.setAttribute("fill", w.msg.poison ? "var(--color-break)" : w.msg.color);
          document.getElementById(`worker-progress-${w.id}`).setAttribute("width", 152 * Math.max(0, 1 - w.remaining / w.total));
        } else {
          state.textContent = "IDLE";
          state.setAttribute("fill", "var(--text-muted)");
          document.getElementById(`worker-progress-${w.id}`).setAttribute("width", 0);
        }
      });

      const fresh = lastDecision && clock.now() - lastDecision.at < 900;
      RULES.forEach((rule, i) => {
        const on = fresh && lastDecision.rule === i;
        const color = rule.sink === "dlq" ? "var(--color-break)" : (rule.sink === "retry" ? "var(--color-promo)" : "var(--color-worker)");
        document.getElementById(`rule-rect-${i}`).setAttribute("stroke", on ? color : "var(--border-hairline)");
        document.getElementById(`rule-then-${i}`).setAttribute("fill", on ? color : "var(--text-muted)");
      });

      tierY.forEach((_, t) => {
        const tier = t + 1;
        const here = parked.filter(p => p.tier === tier);
        document.getElementById(`tier-count-${tier}`).textContent = here.length ? `${here.length} parked` : "";
        document.getElementById(`tier-rect-${tier}`).setAttribute("stroke", here.length ? "var(--color-promo)" : "var(--border-hairline)");
        document.getElementById(`tier-items-${tier}`).innerHTML = here.map(p => {
          const f = Math.min(1, (clock.now() - p.publishedAt) / Math.max(1, p.delay));
          return `<circle cx="${(f * 316).toFixed(1)}" cy="0" r="4.5" fill="${p.msg.color}" stroke="var(--color-promo)" stroke-width="1" class="packet-node" data-id="${p.msg.id}" data-attempt="${p.msg.attempt}" data-history="${p.msg.history.join(" > ")}" data-due="${fmt(Math.max(0, p.dueAt - clock.now()))}" />`;
        }).join("");
      });

      document.getElementById("sink-count-ack").textContent = counts.ack;
      document.getElementById("sink-count-drop").textContent = counts.drop;
      document.getElementById("sink-count-dlq").textContent = counts.dlq;
      ["max_attempts", "terminal", "panic", "poison"].forEach(r => { document.getElementById(`dlq-${r}`).textContent = counts[r]; });

      document.getElementById("particles-layer").innerHTML = particles.map(p => {
        let pt = null;
        if (p.type === "start") pt = pointOn(paths.start[p.worker], p.progress);
        else if (p.type === "tier" || p.type === "sink") {
          const first = paths.toRule[p.worker][p.rule];
          if (p.progress < 0.35) pt = pointOn(first, p.progress / 0.35);
          else if (p.progress < 0.45) pt = { x: 290 + ((p.progress - 0.35) / 0.1) * 270, y: RULE_Y[p.rule] };
          else {
            const second = p.type === "tier" ? paths.ruleToTier[`${p.rule}-${p.tier}`] : paths.ruleToSink[p.rule];
            if (second) pt = pointOn(second, (p.progress - 0.45) / 0.55);
          }
        } else if (p.type === "return" && paths.ret[p.tier - 1]) pt = pointOn(paths.ret[p.tier - 1], p.progress);
        if (!pt) return "";
        return `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="${p.color}" filter="url(#glow)" />`;
      }).join("");

      // HUD.
      const count = cfg.tierCount();
      const ladder = Array.from({ length: Math.min(count, 5) }, (_, i) => fmt(cfg.delayFor(i + 1)));
      document.getElementById("hud-ladder").textContent = count === 0 ? "no tiers" : ladder.join(" > ") + (count > 5 ? " > ..." : "");
      document.getElementById("hud-ladder-sub").textContent = `TierCount ${count} | MaxAttempts ${cfg.maxAttempts} | poison above attempt ${cfg.maxAttempts + SANITY_MARGIN}`;
      if (lastDecision) {
        const rule = RULES[lastDecision.rule];
        const retry = rule.sink === "retry";
        document.getElementById("hud-decision").textContent = retry ? `RETRY T${lastDecision.tier}` : rule.then.toUpperCase();
        document.getElementById("hud-decision").style.color = rule.sink === "dlq" ? "var(--color-break)" : (retry ? "var(--color-promo)" : "var(--color-worker)");
        document.getElementById("hud-decision-sub").textContent = `${lastDecision.msg} attempt ${lastDecision.attempt}: ${lastDecision.text}${retry ? `; copy is attempt ${lastDecision.attempt + 1}` : ""}`;
        document.getElementById("gauge-decision").style.width = fresh ? "100%" : "0%";
      }
      const settled = counts.ack + counts.drop + counts.dlq;
      document.getElementById("hud-settled").textContent = `${counts.ack + counts.drop} / ${counts.dlq}`;
      document.getElementById("hud-settled-sub").textContent = `dropped ${counts.drop} | retries scheduled ${counts.retries}`;
      document.getElementById("gauge-settled").style.width = settled ? `${((counts.ack + counts.drop) / settled) * 100}%` : "0%";
      document.getElementById("hud-parked").textContent = parked.length;
      document.getElementById("gauge-parked").style.width = `${Math.min(100, parked.length * 10)}%`;
    }

    stageBox.addEventListener("mouseover", (e) => {
      const node = e.target.closest(".packet-node");
      if (!node) return;
      const d = node.dataset;
      tooltip.innerHTML = `
        <div style="font-weight:600; margin-bottom:4px;">${d.id}</div>
        <div style="color: var(--text-secondary);">attempt: <span style="color:#fff;">${d.attempt}</span></div>
        <div style="color: var(--text-secondary);">delays so far: <span style="color:#fff;">${d.history || "none"}</span></div>
        ${d.due ? `<div style="margin-top:4px; font-size:10px; color: var(--color-promo);">due in ${d.due}</div>` : ""}`;
      tooltip.classList.add("visible");
    });
    stageBox.addEventListener("mousemove", (e) => {
      const rect = stageBox.getBoundingClientRect();
      tooltip.style.left = `${e.clientX - rect.left + 16}px`;
      tooltip.style.top = `${e.clientY - rect.top + 16}px`;
    });
    stageBox.addEventListener("mouseout", (e) => {
      if (e.target.closest(".packet-node")) tooltip.classList.remove("visible");
    });

    document.getElementById("btn-play-pause").addEventListener("click", () => {
      isPlaying = !isPlaying;
      document.getElementById("play-text").textContent = isPlaying ? "Pause" : "Play";
    });
    document.getElementById("btn-step").addEventListener("click", () => {
      if (!isPlaying) { simulationStep(100); render(); }
    });
    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        speedFactor = parseFloat(btn.dataset.speed);
      });
    });
    document.querySelectorAll(".scenario-tab").forEach(tab => tab.addEventListener("click", () => setScenario(tab.dataset.scenario)));
    document.querySelectorAll(".config-row input").forEach(input => input.addEventListener("change", reset));

    let lastFrameTime = performance.now();
    document.addEventListener("visibilitychange", () => { lastFrameTime = performance.now(); });
    function loop(currentTime) {
      if (document.hidden) {
        lastFrameTime = currentTime;
        requestAnimationFrame(loop);
        return;
      }
      const delta = Math.min(currentTime - lastFrameTime, 100);
      lastFrameTime = currentTime;
      if (isPlaying) simulationStep(delta * speedFactor);
      render();
      requestAnimationFrame(loop);
    }

    setScenario("defaults");
    requestAnimationFrame(loop);
  </script>
</body>
</html>
