version: "2"

# Keep the linter version aligned with the Makefile and CI.

run:
  timeout: 5m

linters:
  default: none
  enable:
    # Correctness checks.
    - govet
    - staticcheck
    - errcheck
    # Unused unexported code, test helpers included.
    - unused
    # Naming, package comments, and exported-symbol docs.
    - revive
    # Import boundaries between core, ports, and drivers.
    - depguard
    # Forbidden APIs for logging and time access.
    - forbidigo
    # Credential and cryptography checks.
    - gosec
    # Wrapped error handling.
    - errorlint
    # Context propagation.
    - contextcheck
    # Database resource handling.
    - sqlclosecheck
    - rowserrcheck
    # Require a specific linter and an explanation for every suppression.
    - nolintlint
    # Standard-library constants and adjacent hygiene.
    - usestdlibvars
    - intrange
    - copyloopvar
    # Modern Go idioms with behavior-preserving rewrites.
    - modernize

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # Keep package import boundaries explicit, including planned drivers.
    depguard:
      rules:
        core:
          files:
            - "**/*.go"
            - "!**/driver/**"
            - "!**/drivers/**"
            - "!**/f1test/**"
            - "!**/cmd/**"
            - "!**/examples/**"
            - "!**/f1otel/**"
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "core must not import drivers"
            - pkg: github.com/twmb/franz-go
              desc: "core must not import a broker client directly"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "core must not import a broker client directly"
            - pkg: go.opentelemetry.io/
              desc: "OpenTelemetry imports belong in f1otel"

        driver-port:
          files:
            - "**/driver/**"
            - "!**/driver/conformance/**"
          allow:
            - $gostd
          deny:
            - pkg: $all
              desc: "the driver port may import only the standard library"

        # The conformance suite tests the port and must not import a driver.
        driver-conformance:
          files:
            - "**/driver/conformance/**"
          allow:
            - $gostd
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - github.com/stretchr/testify
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "the conformance suite must not import a driver"
            - pkg: $all
              desc: "the conformance suite may import only the port and testify"


        # cmd/ registers drivers but must not import broker clients directly.
        cmd:
          files:
            - "**/cmd/**"
          deny:
            - pkg: github.com/twmb/franz-go
              desc: "cmd registers drivers and must not import broker clients directly"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "cmd registers drivers and must not import broker clients directly"
            - pkg: go.opentelemetry.io/
              desc: "OpenTelemetry imports belong in f1otel"

        # An example service is a composition root, like cmd/: it is the layer that
        # chooses a driver, so it may import one. It must still reach the broker only
        # through the driver, because an example that bypassed the SDK would teach the
        # wrong thing to the first person who copies it.
        examples:
          files:
            - "**/examples/**"
          deny:
            - pkg: github.com/twmb/franz-go
              desc: "an example selects a driver and must not import a broker client directly"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "an example selects a driver and must not import a broker client directly"
            - pkg: go.opentelemetry.io/
              desc: "OpenTelemetry imports belong in f1otel"

        f1test:
          files:
            - "**/f1test/**"
          allow:
            - $gostd
            - github.com/stretchr/testify
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers/inmem
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/clock
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/testhook
          deny:
            - pkg: $all
              desc: "f1test may import only the SDK, in-memory driver, clock, test hook, test assertions, and metric reader"

        # Driver production files use strict allowlists. Test files are a separate
        # lax rule: tests may import the SDK and their own driver, but the broad
        # driver deny keeps cross-driver imports visible.
        drivers-kafka:
          files:
            - "**/drivers/kafka/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/twmb/franz-go
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/clock
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/kafka
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/version
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver must not import another driver"
            - pkg: $all
              desc: "a driver may import the standard library, its own broker client, and shared SDK support packages"

        drivers-kafka-tests:
          list-mode: lax
          files:
            - "**/drivers/kafka/*_test.go"
          allow:
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers/kafka
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a Kafka test must not import another driver"

        drivers-rabbitmq:
          files:
            - "**/drivers/rabbitmq/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/rabbitmq/amqp091-go
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/clock
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/wire
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver must not import another driver"
            - pkg: $all
              desc: "a driver may import the standard library, its own broker client, the shared clock, and the wire header names"

        drivers-rabbitmq-tests:
          list-mode: lax
          files:
            - "**/drivers/rabbitmq/*_test.go"
          allow:
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers/rabbitmq
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a RabbitMQ test must not import another driver"

        drivers-inmem:
          files:
            - "**/drivers/inmem/**"
            - "!$test"
          allow:
            - $gostd
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/clock
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/internal/testhook
            - github.com/stretchr/testify
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver must not import another driver"
            - pkg: $all
              desc: "the in-memory driver may import only the standard library, port, clock, test hook, and test assertions"

        drivers-inmem-tests:
          list-mode: lax
          files:
            - "**/drivers/inmem/*_test.go"
          allow:
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers/inmem
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "an in-memory test must not import another driver"

    # The forbidden list replaces the defaults, so list every blocked API.
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: "use structured logging, not a print function"
        - pattern: '^log\.(Print|Printf|Println|Fatal|Fatalf|Fatalln|Panic|Panicf|Panicln)$'
          msg: "use structured logging through f1.WithLogger, not the standard library global logger"
        - pattern: '^time\.Now(\(\))?$'
          msg: "use a clock.Clock's Now, not time.Now directly"
        - pattern: '^time\.Since(\(\))?$'
          msg: "use a clock.Clock's Since, not time.Since directly"
        - pattern: '^time\.Sleep(\(\))?$'
          msg: "use a clock.Clock's Sleep, not time.Sleep directly"
        - pattern: '^time\.After(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.After directly"
        - pattern: '^time\.Tick(\(\))?$'
          msg: "use a clock.Clock's Ticker, not time.Tick directly"
        - pattern: '^time\.NewTimer(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.NewTimer directly"
        - pattern: '^time\.NewTicker(\(\))?$'
          msg: "use a clock.Clock's Ticker, not time.NewTicker directly"
        - pattern: '^time\.AfterFunc(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.AfterFunc directly"

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Exempt only clock API diagnostics inside the clock implementation.
      - path: internal/clock/
        linters:
          - forbidigo
        text: "use a clock.Clock's"
      # Example stdout is the interface shown in the quickstart.
      - path: examples/
        linters:
          - forbidigo
        text: "use structured logging, not a print function"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk
