version: "2"

# Pinned in Makefile and CI at the same version - a mismatch here is the
# "green locally, red in CI" trap (SETUP-04, SETUP-06).

run:
  timeout: 5m

linters:
  default: none
  enable:
    # correctness baseline (doc 15 §3)
    - govet
    - staticcheck
    - errcheck
    # naming, package comments, exported-symbol docs
    - revive
    # import boundaries: core -> drivers, driver = stdlib-only,
    # a driver = stdlib + its own broker client only (doc 02 §1).
    - depguard
    # forbidigo's forbid: list REPLACES its built-in defaults, it does not
    # extend them (verified: unset it and fmt.Println passes silently) - so
    # the fmt.Print*/print/println ban (doc 15 §3) is restated explicitly
    # below, alongside the clock rule (doc 11 §2, doc 15 §7.4). No cmd/
    # exclusion path exists yet because cmd/ doesn't. internal/clock is
    # exempted from the clock patterns only (M1-04).
    - forbidigo
    # no hardcoded credentials, no weak rand where it matters
    - gosec
    # errors.Is/As instead of type assertions and == on wrapped errors
    - errorlint
    # contexts actually propagated
    - contextcheck
    # store/postgres hygiene
    - sqlclosecheck
    - rowserrcheck
    # a bare //nolint fails; //nolint:<linter> // <reason> passes (doc 15 §3).
    - nolintlint

  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: false

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    # The three import boundaries from doc 02 §1. Rules for drivers/kafka
    # and drivers/rabbitmq are written by module path now, before either
    # package exists, so the guard is armed before M2 adds franz-go rather
    # than after (SETUP-05).
    depguard:
      rules:
        core:
          files:
            - "**/*.go"
            - "!**/driver/**"
            - "!**/drivers/**"
            - "!**/cmd/**"
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "core must not import drivers (doc 02 §1) - the core never knows which broker is wired"
            - pkg: github.com/twmb/franz-go
              desc: "core must not import a broker client directly (doc 02 §1) - only drivers/kafka may"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "core must not import a broker client directly (doc 02 §1) - only drivers/rabbitmq may"

        driver-port:
          files:
            - "**/driver/**"
            - "!**/driver/conformance/**"
          allow:
            - $gostd
          deny:
            - pkg: $all
              desc: "driver (the port) is stdlib-only (doc 02 §2) - a third-party import belongs in a driver implementation, not the port"

        # The shared conformance suite (doc 02 §2, doc 04 §6) sits under driver/
        # but is a test suite, not the port: it imports the port it exercises
        # plus testify (doc 15 §1.1). It must never import a driver - the suite
        # is what every driver is measured against, so it cannot know any.
        driver-conformance:
          files:
            - "**/driver/conformance/**"
          allow:
            - $gostd
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
            - github.com/stretchr/testify
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "the conformance suite never imports a driver (doc 04 §6) - it is the measure, not a consumer"
            - pkg: $all
              desc: "the conformance suite imports the port and testify only (doc 04 §6)"

        # cmd/ is this module's composition root: its binaries register drivers
        # by blank import exactly as an application does (doc 02 §2). That is
        # the one place "core must not import drivers" does not apply - but
        # reaching a broker client directly still never does.
        cmd:
          files:
            - "**/cmd/**"
          deny:
            - pkg: github.com/twmb/franz-go
              desc: "cmd registers drivers by blank import; it never speaks to a broker client directly (doc 02 §1)"
            - pkg: github.com/rabbitmq/amqp091-go
              desc: "cmd registers drivers by blank import; it never speaks to a broker client directly (doc 02 §1)"

        drivers-kafka:
          files:
            - "**/drivers/kafka/**"
          allow:
            - $gostd
            - github.com/twmb/franz-go
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver never imports another driver (doc 02 §1) - depguard matches prefixes, so allowing the port would otherwise allow every sibling under drivers/"
            - pkg: $all
              desc: "a driver imports stdlib plus its own broker client only (doc 02 §1)"

        drivers-rabbitmq:
          files:
            - "**/drivers/rabbitmq/**"
          allow:
            - $gostd
            - github.com/rabbitmq/amqp091-go
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver never imports another driver (doc 02 §1) - depguard matches prefixes, so allowing the port would otherwise allow every sibling under drivers/"
            - pkg: $all
              desc: "a driver imports stdlib plus its own broker client only (doc 02 §1)"

        drivers-inmem:
          files:
            - "**/drivers/inmem/**"
          allow:
            - $gostd
            - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/driver
          deny:
            - pkg: fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk/drivers
              desc: "a driver never imports another driver (doc 02 §1) - depguard matches prefixes, so allowing the port would otherwise allow every sibling under drivers/"
            - pkg: $all
              desc: "the in-memory driver has no broker client: stdlib plus the port only (doc 02 §1)"

    # forbid: replaces the built-in defaults (see the comment above), so the
    # fmt.Print*/print/println ban is restated here explicitly (doc 15 §3),
    # then every way to reach the wall clock outside internal/clock (doc 11
    # §2, doc 15 §7.4) - not just the four convenience wrappers, but the
    # NewTimer/NewTicker/AfterFunc/Since forms too, since those are what a
    # developer reaches for once After/Tick are blocked.
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print(|f|ln)|print|println)$'
          msg: "use structured logging, not a print function (doc 15 §3)"
        - pattern: '^time\.Now(\(\))?$'
          msg: "use a clock.Clock's Now, not time.Now directly (doc 15 §7.4)"
        - pattern: '^time\.Since(\(\))?$'
          msg: "use a clock.Clock's Since, not time.Since directly (doc 15 §7.4)"
        - pattern: '^time\.Sleep(\(\))?$'
          msg: "use a clock.Clock's Sleep, not time.Sleep directly (doc 15 §7.4)"
        - pattern: '^time\.After(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.After directly (doc 15 §7.4)"
        - pattern: '^time\.Tick(\(\))?$'
          msg: "use a clock.Clock's Ticker, not time.Tick directly (doc 15 §7.4)"
        - pattern: '^time\.NewTimer(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.NewTimer directly (doc 15 §7.4)"
        - pattern: '^time\.NewTicker(\(\))?$'
          msg: "use a clock.Clock's Ticker, not time.NewTicker directly (doc 15 §7.4)"
        - pattern: '^time\.AfterFunc(\(\))?$'
          msg: "use a clock.Clock's Timer, not time.AfterFunc directly (doc 15 §7.4)"

  exclusions:
    presets:
      - std-error-handling
    rules:
      # Scoped to the clock patterns' own message text, not the whole path:
      # internal/clock legitimately calls time.Now/NewTimer/NewTicker/etc (it
      # is what they implement), but forbidigo's other rules - the
      # fmt.Print*/print/println ban above - still apply inside this package,
      # same as everywhere else (verified: 0 issues before and after this
      # fix, since the package has no such calls; a probe fmt.Println here
      # was caught pre-fix and stays caught).
      - path: internal/clock/
        linters:
          - forbidigo
        text: "doc 15 §7.4"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - fgit.zapps.vn/zatf2026-be-t3/event-driven-messaging-sdk
